<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Solar System Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Canvas area -->
    <div class="canvas-container">
      <canvas id="solar-canvas"></canvas>

      <!-- Controls bar -->
      <div class="controls-bar">
        <div class="search-box">
          <span class="search-icon">&#128269;</span>
          <input type="text" id="search-input" placeholder="Search planets, moons...">
          <div class="search-results" id="search-results"></div>
        </div>

        <div class="control-group">
          <button class="control-btn active" id="btn-labels">&#128221; Labels</button>
          <button class="control-btn active" id="btn-orbits">&#9711; Orbits</button>
        </div>

        <div class="control-group">
          <button class="control-btn" id="btn-pause">&#9646;&#9646; Pause</button>
          <button class="control-btn" id="btn-reset">&#8634; Reset</button>
        </div>

        <div class="control-group speed-control">
          <label>Speed</label>
          <input type="range" id="speed-slider" class="speed-slider" min="0.1" max="5" step="0.1" value="1">
          <span class="speed-value" id="speed-value">1.0x</span>
        </div>

        <button class="control-btn" id="btn-focus-sun">&#9788; Sun</button>
      </div>

      <div class="tooltip" id="tooltip"></div>
    </div>

    <!-- Info panel -->
    <div class="info-panel">
      <div class="panel-header">
        <div class="panel-title" id="panel-title">The Sun</div>
        <div class="panel-subtitle" id="panel-subtitle">Center of the Solar System</div>
      </div>

      <div class="body-selector" id="body-selector"></div>

      <div id="info-content">
        <div class="info-section">
          <div class="info-label">Type</div>
          <div class="info-value">G-type Main-Sequence Star (G2V)</div>
        </div>
      </div>
    </div>
  </div>

  <script src="solar-system-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
