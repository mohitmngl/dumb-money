{% extends "base.html" %}
{% block title %}String Screener - {{ market }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>String Screener</h1>
  <div class="flex-row">
    <button class="btn btn-primary btn-sm" onclick="runBacktest()">Run Backtest</button>
    <button class="btn btn-sm" onclick="cancelBacktest()">Cancel</button>
  </div>
</div>
<div class="card mb-16" id="ssStatus" style="display:none"><div class="flex-row"><div class="spinner"></div><span id="ssStatusText"></span></div></div>
<div class="filter-rail mb-16">
  <label>Search:</label><input id="ssSearch" type="text" style="width:160px" placeholder="Strategy name">
  <label>Min Win%:</label><input id="ssMinWin" type="number" style="width:75px" step="1">
  <label>Min P(Up):</label><input id="ssMinProb" type="number" style="width:75px" step="1">
  <label>Min Avg 1D:</label><input id="ssMinAvg" type="number" style="width:75px" step="0.1">
  <label>Min Entries:</label><input id="ssMinEntries" type="number" style="width:90px" step="10">
  <label><input id="ssHideRandom" type="checkbox" checked> Hide random</label>
  <button class="btn btn-sm" onclick="ssPage=1;loadStrategies()">Apply</button>
  <button class="btn btn-sm" onclick="clearSSFilters()">Clear</button>
</div>
<div class="card" style="padding:0;overflow:hidden">
  <div id="strategiesTable"><div class="loading" style="padding:40px"><div class="spinner"></div> Loading strategies...</div></div>
</div>
<div class="pagination" id="pagination"></div>
<script>
let ssPage=1,ssSort='sharpe_1d',ssDir='desc';
function loadStrategies(){
  const params = new URLSearchParams({
    market: MARKET, page: ssPage, sort: ssSort, sort_dir: ssDir,
    search: document.getElementById('ssSearch').value,
    min_win: document.getElementById('ssMinWin').value,
    min_prob: document.getElementById('ssMinProb').value,
    min_avg: document.getElementById('ssMinAvg').value,
    min_entries: document.getElementById('ssMinEntries').value,
    hide_random: document.getElementById('ssHideRandom').checked ? '1' : ''
  });
  fetch(`/api/string-screener/strategies?${params}`).then(r=>r.json()).then(d=>{
    const strats=d.strategies||[];
    if(!strats.length){document.getElementById('strategiesTable').innerHTML='<div class="empty-state"><h3>No strategies yet</h3><p>Click "Run Backtest" to generate thousands of string strategies.</p></div>';return;}
    let html='<table><thead><tr><th onclick="ssSortBy(\'name\')">Name</th><th onclick="ssSortBy(\'sharpe_1d\')">Sharpe</th><th onclick="ssSortBy(\'win_rate\')">Win Rate</th><th onclick="ssSortBy(\'avg_1d_return\')">Avg 1D</th><th onclick="ssSortBy(\'prob_up_1d\')">P(Up)</th><th onclick="ssSortBy(\'prob_up_1pct\')">P(+1%)</th><th onclick="ssSortBy(\'prob_down_2pct\')">P(-2%)</th><th onclick="ssSortBy(\'total_entries\')">Entries</th><th onclick="ssSortBy(\'current_count\')">Current</th><th>Members</th><th></th></tr></thead><tbody>';
    strats.forEach(s=>{
      const wr=s.win_rate||0,ar=s.avg_1d_return||0,pd2=s.prob_up_1d||0;
      html+=`<tr><td><a href="/${MARKET==='INDIA'?'india/':''}string-screener/strategy/${s.id}">${s.name}</a>${s.is_random?'<span class="badge badge-info" style="margin-left:4px">Random</span>':''}</td>`;
      html+=`<td class="numeric">${(s.sharpe_1d||0).toFixed(3)}</td>`;
      html+=`<td class="numeric ${wr>=50?'text-up':'text-down'}">${wr.toFixed(1)}%</td>`;
      html+=`<td class="numeric ${ar>=0?'text-up':'text-down'}">${ar>=0?'+':''}${ar.toFixed(3)}%</td>`;
      html+=`<td class="numeric">${pd2.toFixed(1)}%</td>`;
      html+=`<td class="numeric">${(s.prob_up_1pct||0).toFixed(1)}%</td>`;
      html+=`<td class="numeric">${(s.prob_down_2pct||0).toFixed(1)}%</td>`;
      html+=`<td class="numeric">${s.total_entries||0}</td>`;
      html+=`<td class="numeric">${s.current_count||0}</td>`;
      html+=`<td style="font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis">${(s.current_symbols||'').substring(0,60)}${(s.current_symbols||'').length>60?'...':''}</td>`;
      html+=`<td><a href="/${MARKET==='INDIA'?'india/':''}string-screener/strategy/${s.id}" class="btn btn-sm">Detail</a></td></tr>`;
    });
    html+='</tbody></table>';
    document.getElementById('strategiesTable').innerHTML=html;
    let ph='';
    const tp=Math.ceil((d.total||0)/50);
    for(let i=1;i<=tp;i++){if(i===1||i===tp||Math.abs(i-ssPage)<=2){ph+=`<button class="${i===ssPage?'active':''}" onclick="ssPageGo(${i})">${i}</button>`;}}
    document.getElementById('pagination').innerHTML=ph;
  });
}
function ssSortBy(k){if(ssSort===k)ssDir=ssDir==='desc'?'asc':'desc';else{ssSort=k;ssDir='desc';}loadStrategies();}
function ssPageGo(p){ssPage=p;loadStrategies();}
function clearSSFilters(){
  ['ssSearch','ssMinWin','ssMinProb','ssMinAvg','ssMinEntries'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('ssHideRandom').checked=true;
  ssPage=1; loadStrategies();
}
function runBacktest(){
  document.getElementById('ssStatus').style.display='block';
  document.getElementById('ssStatusText').textContent='Starting backtest...';
  fetch('/api/string-screener/backtest/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({market:MARKET})}).then(r=>r.json()).then(d=>{
    if(d.started){showToast('Backtest started');setInterval(pollSS,3000);}
  });
}
function pollSS(){
  fetch('/api/string-screener/backtest/status').then(r=>r.json()).then(d=>{
    document.getElementById('ssStatusText').textContent=d.phase||d.status||'Running...';
    if(d.status==='complete'){document.getElementById('ssStatus').style.display='none';loadStrategies();}
    if(d.status==='error'){document.getElementById('ssStatusText').textContent='Error: '+d.phase;}
  });
}
function cancelBacktest(){fetch('/api/string-screener/backtest/cancel',{method:'POST'});document.getElementById('ssStatus').style.display='none';}
loadStrategies();
</script>
{% endblock %}
