{% extends "base.html" %}
{% block title %}Portfolios - {{ market }}{% endblock %}
{% block content %}
<style>
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .port-card{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--border);background:var(--surface-solid);padding:24px;transition:all .3s;animation:fadeUp .5s ease both}
  .port-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(0,0,0,.15);border-color:var(--brand,#10b981)}
  .port-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand,#10b981),#10b981)}
  .port-name{font-size:22px;font-weight:800;letter-spacing:-.5px;text-decoration:none;color:var(--text)}
  .port-name:hover{color:var(--brand)}
  .mini-chart{height:60px;margin:12px 0}
  .pnl-up{color:#10b981}.pnl-down{color:#ef4444}
  .string-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:24px;font-size:13px;font-weight:600;background:rgba(37,99,235,.06);border:1px solid rgba(37,99,235,.15);color:var(--text);text-decoration:none;transition:all .2s}
  .string-chip:hover{background:rgba(37,99,235,.15);transform:scale(1.03)}
  .overall-card{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px;color:#fff;animation:fadeUp .4s ease both}
  .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  .modal-overlay.show{display:flex}
  .modal-box{background:var(--surface-solid);border:1px solid var(--border);border-radius:16px;padding:0;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;animation:fadeUp .3s ease}
  .modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .modal-body{padding:24px}
  .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
  .field-group{margin-bottom:16px}
  .field-label{font-size:12px;color:var(--text-muted);margin-bottom:4px;display:block}
  .field-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;transition:border-color .2s}
  .field-input:focus{outline:none;border-color:var(--brand,#10b981)}
  .btn-primary{background:var(--brand,#10b981);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer;transition:all .2s}
  .btn-primary:hover{opacity:.9;transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border);padding:10px 20px;border-radius:8px;cursor:pointer;transition:all .2s}
  .btn-ghost:hover{border-color:#666}
  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:12px}
  .tf-btn{font-size:11px;padding:3px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text-muted);cursor:pointer;transition:all .15s}
  .tf-btn:hover{border-color:#666;color:var(--text)}
  .tf-btn.active{background:var(--brand,#10b981);color:#fff;border-color:var(--brand,#10b981)}
  .chart-toggle{font-size:11px;padding:4px 12px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text-muted);cursor:pointer;transition:all .15s}
  .chart-toggle.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
</style>

<div class="page-header">
  <h1 style="font-size:28px;font-weight:800;letter-spacing:-1px">Portfolios</h1>
  <div style="display:flex;gap:8px">
    <button class="btn-primary" onclick="showModal('createPortfolio')">+ New Portfolio</button>
  </div>
</div>

<div id="overallCard"></div>

<div style="display:flex;gap:8px;margin-bottom:0;margin-top:16px">
  <button class="chart-toggle active" id="togStockChart" onclick="switchChart('stock')">Stock Chart</button>
  <button class="chart-toggle" id="togEquityChart" onclick="switchChart('equity')">Equity Curve</button>
</div>

<div id="stockChartSection" class="card mb-16" style="overflow:hidden;border-radius:0 0 16px 16px;margin-top:0">
  <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)">
    <div style="font-size:13px;font-weight:700">All Portfolios</div>
    <div style="width:1px;height:20px;background:var(--border)"></div>
    <div style="display:flex;gap:4px">
      <button class="tf-btn active" data-tf="1D" onclick="setTF(this,'stock')">1D</button>
      <button class="tf-btn" data-tf="1W" onclick="setTF(this,'stock')">1W</button>
      <button class="tf-btn" data-tf="1M" onclick="setTF(this,'stock')">1M</button>
    </div>
    <div style="width:1px;height:20px;background:var(--border)"></div>
    <button id="togST" class="btn-ghost active" style="font-size:11px;padding:4px 8px" onclick="toggleST()"><span style="color:#10b981">&#9632;</span> ST</button>
    <button id="togATR" class="btn-ghost active" style="font-size:11px;padding:4px 8px" onclick="toggleATR()"><span style="color:#f59e0b">&#9632;</span> ATR</button>
    <button id="togVol" class="btn-ghost active" style="font-size:11px;padding:4px 8px" onclick="toggleVol()">Vol</button>
    <div style="flex:1"></div>
    <span style="font-size:11px;color:var(--text-muted)" id="barCount"></span>
  </div>
  <div id="mainChartWrap" style="position:relative;height:400px">
    <div id="mainChartBox" style="width:100%;height:100%"></div>
    <div id="chartTooltip" style="position:absolute;top:8px;left:12px;z-index:20;pointer-events:none;font-size:11px;font-family:monospace;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.82);color:#fff;display:none;white-space:nowrap"></div>
  </div>
</div>

<div id="equityChartSection" class="card mb-16" style="overflow:hidden;border-radius:16px;display:none">
  <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)">
    <div style="font-size:13px;font-weight:700">Portfolio Equity</div>
    <div style="width:1px;height:20px;background:var(--border)"></div>
    <div style="display:flex;gap:4px">
      <button class="tf-btn active" data-tf="1D" onclick="setTF(this,'equity')">1D</button>
      <button class="tf-btn" data-tf="1W" onclick="setTF(this,'equity')">1W</button>
      <button class="tf-btn" data-tf="1M" onclick="setTF(this,'equity')">1M</button>
    </div>
    <div style="flex:1"></div>
    <span style="font-size:11px;color:var(--text-muted)" id="eqBarCount"></span>
  </div>
  <div style="position:relative;height:400px">
    <div id="equityChartBox" style="width:100%;height:100%"></div>
    <div id="equityTooltip" style="position:absolute;top:8px;left:12px;z-index:20;pointer-events:none;font-size:11px;font-family:monospace;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.82);color:#fff;display:none;white-space:nowrap"></div>
  </div>
</div>

<div class="section-title" style="margin-top:24px;margin-bottom:12px">Your Portfolios</div>
<div id="portfolioGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px"></div>

<div class="modal-overlay" id="createPortfolioModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 style="margin:0;font-size:18px">New Portfolio</h3>
      <button class="btn-ghost" onclick="hideModal('createPortfolio')" style="padding:4px 8px;font-size:18px">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field-group">
        <label class="field-label">Portfolio Name</label>
        <input id="newPortName" class="field-input" placeholder="e.g. Tech Growth" autofocus>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="hideModal('createPortfolio')">Cancel</button>
      <button class="btn-primary" onclick="createPortfolio()">Create</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addStringModal">
  <div class="modal-box" style="width:620px">
    <div class="modal-header">
      <h3 style="margin:0;font-size:18px">Add String to <span id="addStringPortName"></span></h3>
      <button class="btn-ghost" onclick="hideModal('addString')" style="padding:4px 8px;font-size:18px">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field-group">
        <label class="field-label">String Name</label>
        <input id="newStringName" class="field-input" placeholder="e.g. FAANG Long">
      </div>
      <div class="field-group">
        <label class="field-label">Symbols (format: SYMBOL*qty+SYMBOL*qty)</label>
        <input id="newStringRaw" class="field-input" placeholder="AAPL*10+MSFT*15+GOOGL*5" style="font-family:monospace">
      </div>
      <div class="field-group" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <label class="field-label">Entry Date *</label>
          <input id="newStringEntryDate" type="date" class="field-input" value="">
        </div>
        <div>
          <label class="field-label">Entry Price (leave blank = auto)</label>
          <input id="newStringEntryPrice" type="number" step="0.01" class="field-input" placeholder="Auto-calculate">
        </div>
      </div>
      <div id="newStringPreview" style="margin-top:8px"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="hideModal('addString')">Cancel</button>
      <button class="btn-ghost" onclick="previewNewString()">Preview</button>
      <button class="btn-primary" onclick="confirmAddString()">Add String</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const{createChart,CandlestickSeries,LineSeries,HistogramSeries}=LightweightCharts;
let mainChart=null,equityChart=null,showST=true,showATR=true,showVol=true,currentTF='1D',equityTF='1D',activeChartType='stock';
function signedPct(n){n=Number(n);if(!Number.isFinite(n))return'-';return(n>=0?'+':'')+n.toFixed(2)+'%'}
function showModal(name){document.getElementById(name+'Modal').classList.add('show')}
function hideModal(name){document.getElementById(name+'Modal').classList.remove('show')}
function cur(){return MARKET==='INDIA'?'\u20B9':'$'}

function switchChart(type){
  activeChartType=type;
  document.getElementById('stockChartSection').style.display=type==='stock'?'block':'none';
  document.getElementById('equityChartSection').style.display=type==='equity'?'block':'none';
  document.getElementById('togStockChart').classList.toggle('active',type==='stock');
  document.getElementById('togEquityChart').classList.toggle('active',type==='equity');
  if(type==='equity') loadEquityChart();
  else loadMainChart();
}
function setTF(btn,chartType){
  const tf=btn.dataset.tf;
  btn.parentElement.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(chartType==='stock'){currentTF=tf;loadMainChart()}
  else{equityTF=tf;loadEquityChart()}
}
function toggleST(){showST=!showST;document.getElementById('togST').classList.toggle('active');loadMainChart()}
function toggleATR(){showATR=!showATR;document.getElementById('togATR').classList.toggle('active');loadMainChart()}
function toggleVol(){showVol=!showVol;document.getElementById('togVol').classList.toggle('active');loadMainChart()}

function loadPortfolios(){
  fetch('/api/portfolios?market='+MARKET).then(r=>r.json()).then(data=>{
    renderOverall(data);
    renderGrid(data);
  });
}

function renderOverall(ports){
  if(!ports.length){document.getElementById('overallCard').innerHTML='';return}
  let totalInvested=0,totalCurrent=0,strings=0,symbols=0,chgNum=0,chgDen=0;
  let bookedProfit=0,runningValue=0;
  ports.forEach(p=>{
    (p.strings||[]).forEach(s=>{
      strings++;
      const syms=s.symbols||[];
      syms.forEach(x=>symbols++);
      if(s.status==='closed'){
        bookedProfit+=(s.realised_pnl||0);
      } else {
        totalInvested+=(s.entry_value||0);
        totalCurrent+=(s.current_value||0);
        runningValue+=(s.current_value||0);
        if(s.current_value>0){chgNum+=(s.change_pct||0)*s.current_value;chgDen+=s.current_value}
      }
    });
  });
  const totalValue=runningValue+bookedProfit;
  const totalPnl=bookedProfit+(totalCurrent-totalInvested);
  const totalPnlPct=totalInvested>0?((totalPnl/totalInvested)*100):0;
  const totalChg=chgDen>0?chgNum/chgDen:0;
  const totalChgAbs=runningValue*(totalChg/100);
  const chgColor=totalChg>=0?'#10b981':'#ef4444';
  const pnlColor=totalPnl>=0?'#10b981':'#ef4444';
  const bookedColor=bookedProfit>=0?'#10b981':'#ef4444';
  document.getElementById('overallCard').innerHTML=`
    <div class="overall-card">
      <div class="section-title" style="color:rgba(255,255,255,.5)">OVERVIEW</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:20px;margin-top:16px">
        <div><div style="font-size:12px;opacity:.5">Total Value</div><div style="font-size:24px;font-weight:800">${cur()}${totalValue.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0})}</div></div>
        <div><div style="font-size:12px;opacity:.5">Running</div><div style="font-size:24px;font-weight:800">${cur()}${runningValue.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0})}</div></div>
        <div><div style="font-size:12px;opacity:.5">Invested</div><div style="font-size:24px;font-weight:800">${cur()}${totalInvested.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0})}</div></div>
        <div><div style="font-size:12px;opacity:.5">Booked</div><div style="font-size:24px;font-weight:800;color:${bookedColor}">${bookedProfit>=0?'+':''}${cur()}${Math.abs(bookedProfit).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0})}</div></div>
        <div><div style="font-size:12px;opacity:.5">Total P&L</div><div style="font-size:24px;font-weight:800;color:${pnlColor}">${totalPnl>=0?'+':''}${cur()}${Math.abs(totalPnl).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0})} (${signedPct(totalPnlPct)})</div></div>
        <div><div style="font-size:12px;opacity:.5">Today</div><div style="font-size:24px;font-weight:800;color:${chgColor}">${signedPct(totalChg)} (${totalChgAbs>=0?'+':''}${cur()}${Math.abs(totalChgAbs).toFixed(0)})</div></div>
        <div><div style="font-size:12px;opacity:.5">Strings</div><div style="font-size:24px;font-weight:800">${strings}</div></div>
      </div>
    </div>`;
}

function renderGrid(ports){
  const grid=document.getElementById('portfolioGrid');
  if(!ports.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-muted)"><h3>No portfolios yet</h3><p>Create your first portfolio to start tracking.</p></div>';return}
  let html='';
  ports.forEach((p,i)=>{
    const strings=p.strings||[];
    const delay=i*0.08;
    const running=strings.filter(s=>s.status!=='closed');
    const closed=strings.filter(s=>s.status==='closed');
    html+=`<div class="port-card" style="animation-delay:${delay}s">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <a href="/${MARKET==='INDIA'?'india/':''}portfolio/${p.id}" class="port-name">${p.name}</a>
        <div style="display:flex;gap:4px">
          <button class="btn-ghost" style="padding:4px 8px;font-size:11px" onclick="renamePortfolio(${p.id},'${p.name.replace(/'/g,"\\'")}')">Edit</button>
          <button class="btn-ghost" style="padding:4px 8px;font-size:11px;color:#ef4444" onclick="deletePortfolio(${p.id})">Del</button>
        </div>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:4px">${running.length} running, ${closed.length} closed &middot; ${p.symbol_count} stocks</div>
      <div class="mini-chart" id="minichart-${p.id}"><div style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:11px">Loading chart...</div></div>`;
    if(strings.length>0){
      html+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">';
      strings.forEach(s=>{
        const chg=s.change_pct||0;
        const chgAbs=s.current_value?(s.current_value*chg/100):0;
        const chgColor=s.status==='closed'?(s.realised_pnl>=0?'#10b981':'#ef4444'):(chg>=0?'#10b981':'#ef4444');
        const label=s.status==='closed'?`${cur()}${Math.abs(s.realised_pnl||0).toFixed(0)} P&L`:`${chg>=0?'+':''}${chg.toFixed(1)}% (${chgAbs>=0?'+':''}${cur()}${Math.abs(chgAbs).toFixed(0)})`;
        html+=`<a href="/${MARKET==='INDIA'?'india/':''}portfolio/${p.id}/string/${s.id}" class="string-chip" style="${s.status==='closed'?'opacity:.7;border-color:rgba(239,68,68,.2);background:rgba(239,68,68,.04)':''}">${s.name||'String #'+s.id} <span style="color:${chgColor};font-size:11px;margin-left:4px">${label}</span></a>`;
      });
      html+='</div>';
    }
    html+=`<div style="margin-top:12px">
      <button class="btn-ghost" style="font-size:12px;padding:6px 12px" onclick="openAddString(${p.id},'${p.name.replace(/'/g,"\\'")}')">+ Add String</button>
    </div></div>`;
  });
  grid.innerHTML=html;
  ports.forEach(p=>loadMiniChart(p.id));
}

function loadMiniChart(pid){
  fetch('/api/portfolio/'+pid+'/minichart?market='+MARKET+'&limit=30').then(r=>r.json()).then(data=>{
    const box=document.getElementById('minichart-'+pid);
    if(!data||data.length<2){box.innerHTML='';return}
    const closes=data.map(d=>d.close);
    const min=Math.min(...closes),max=Math.max(...closes);
    const range=max-min||1;
    const w=box.clientWidth||300,h=60;
    let path='M';
    data.forEach((d,i)=>{
      const x=i/(data.length-1)*w;
      const y=h-((d.close-min)/range)*h*.8-h*.1;
      path+=`${i?'L':''}${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const lastClose=closes[closes.length-1];
    const firstClose=closes[0];
    const chg=firstClose>0?((lastClose-firstClose)/firstClose*100):0;
    const color=chg>=0?'#10b981':'#ef4444';
    box.innerHTML=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%"><defs><linearGradient id="gc-${pid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".3"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${path} L${w},${h} L0,${h} Z" fill="url(#gc-${pid})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2"/></svg>`;
  });
}

function createPortfolio(){
  const name=document.getElementById('newPortName').value.trim();
  if(!name){return}
  fetch('/api/portfolios',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({market:MARKET,name})})
  .then(r=>r.json()).then(()=>{hideModal('createPortfolio');document.getElementById('newPortName').value='';loadPortfolios()});
}
function deletePortfolio(pid){
  if(!confirm('Delete this portfolio and all its strings?'))return;
  fetch('/api/portfolios/'+pid+'?market='+MARKET,{method:'DELETE'}).then(()=>loadPortfolios());
}
function renamePortfolio(pid,oldName){
  document.getElementById('newPortName').value=oldName;
  showModal('createPortfolio');
  document.getElementById('newPortName').onkeydown=function(e){if(e.key==='Enter')renameConfirm(pid)};
}
function renameConfirm(pid){
  const name=document.getElementById('newPortName').value.trim();
  if(!name)return;
  fetch('/api/portfolio/'+pid+'/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({market:MARKET,name})})
  .then(()=>{hideModal('createPortfolio');loadPortfolios()});
}

let addStringPid=0;
function openAddString(pid,portName){
  addStringPid=pid;
  document.getElementById('addStringPortName').textContent=portName;
  document.getElementById('newStringName').value='';
  document.getElementById('newStringRaw').value='';
  document.getElementById('newStringEntryDate').value=new Date().toISOString().slice(0,10);
  document.getElementById('newStringEntryPrice').value='';
  document.getElementById('newStringPreview').innerHTML='';
  showModal('addString');
}
let newStringSyms=[];
function previewNewString(){
  const raw=document.getElementById('newStringRaw').value;
  if(!raw.trim())return;
  fetch('/api/portfolio/string/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({market:MARKET,symbols:raw})})
  .then(r=>r.json()).then(d=>{
    if(d.error){document.getElementById('newStringPreview').innerHTML='<span style="color:#ef4444">'+d.error+'</span>';return}
    newStringSyms=d.symbols;
    let html='<table style="width:100%;font-size:12px;border-collapse:collapse"><tr style="color:var(--text-muted)"><th style="text-align:left;padding:4px">Symbol</th><th style="text-align:right;padding:4px">Price</th><th style="text-align:right;padding:4px">Qty</th><th style="text-align:right;padding:4px">Value</th></tr>';
    d.symbols.forEach(s=>{html+='<tr><td style="padding:4px;font-weight:600">'+s.symbol+'</td><td style="text-align:right">'+cur()+s.price.toFixed(2)+'</td><td style="text-align:right">'+s.qty+'</td><td style="text-align:right">'+cur()+(s.price*s.qty).toFixed(2)+'</td></tr>'});
    html+='<tr style="font-weight:700;border-top:1px solid var(--border)"><td style="padding:4px">Total</td><td></td><td></td><td style="text-align:right">'+cur()+d.total_value.toFixed(2)+'</td></tr></table>';
    document.getElementById('newStringPreview').innerHTML=html;
  });
}
function confirmAddString(){
  if(!newStringSyms.length){previewNewString();return}
  const entryDate=document.getElementById('newStringEntryDate').value;
  if(!entryDate){alert('Entry date is required');return}
  const entryPrice=document.getElementById('newStringEntryPrice').value;
  const ep=entryPrice?Number(entryPrice):newStringSyms.reduce((a,s)=>a+s.price*s.qty,0);
  fetch('/api/portfolio/string/add',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({market:MARKET,portfolio_id:addStringPid,name:document.getElementById('newStringName').value.trim(),entry_date:entryDate,entry_price:ep,fractional:0,symbols:newStringSyms})
  }).then(r=>r.json()).then(d=>{
    if(d.ok){hideModal('addString');newStringSyms=[];loadPortfolios()}
  });
}

document.querySelectorAll('.modal-overlay').forEach(m=>{m.addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')})});
document.getElementById('newPortName').addEventListener('keydown',function(e){if(e.key==='Enter')createPortfolio()});

function getTC(){const d=document.documentElement.getAttribute('data-theme')==='dark';return{bg:d?'#131722':'#ffffff',txt:d?'#d1d4dc':'#333',grid:d?'rgba(42,46,57,.6)':'rgba(0,0,0,.06)'}}

function loadMainChart(){
  const box=document.getElementById('mainChartBox');
  box.innerHTML='<div style="padding:40px;text-align:center;color:var(--text-muted)">Loading chart...</div>';
  Promise.all([
    fetch('/api/portfolios/ohlc?market='+MARKET+'&limit=500&timeframe='+currentTF).then(r=>r.json()),
    fetch('/api/portfolios/supertrend?market='+MARKET+'&period=14&multiplier=2.0').then(r=>r.json()),
  ]).then(([ohlc,stData])=>{
    box.innerHTML='';
    document.getElementById('barCount').textContent=(ohlc?ohlc.length:0)+' bars';
    renderMainChart(ohlc,stData);
  }).catch(()=>{box.innerHTML='<div style="padding:40px;text-align:center;color:var(--text-muted)">No data</div>'});
}

function renderMainChart(ohlc,stData){
  if(!ohlc||!ohlc.length){document.getElementById('mainChartBox').innerHTML='<div style="padding:40px;text-align:center;color:var(--text-muted)">No data</div>';return}
  if(mainChart){mainChart.remove();mainChart=null}
  const tc=getTC(),box=document.getElementById('mainChartBox'),tip=document.getElementById('chartTooltip');
  mainChart=createChart(box,{width:box.clientWidth,height:400,autoSize:true,layout:{background:{type:'solid',color:tc.bg},textStyle:{color:tc.txt,fontFamily:'system-ui'}},grid:{vertLines:{color:tc.grid},horzLines:{color:tc.grid}},crosshair:{mode:0},rightPriceScale:{borderVisible:false,autoScale:true,scaleMargins:{top:.08,bottom:.18}},timeScale:{timeVisible:false,secondsVisible:false,borderVisible:false}});
  const cs=mainChart.addSeries(CandlestickSeries,{upColor:'#10b981',downColor:'#ef4444',borderVisible:false,wickUpColor:'#10b981',wickDownColor:'#ef4444'});
  cs.setData(ohlc.map(d=>({time:d.time,open:d.open,high:d.high,low:d.low,close:d.close})));
  const vs=mainChart.addSeries(HistogramSeries,{priceFormat:{type:'volume'},priceScaleId:'vol'});
  mainChart.priceScale('vol').applyOptions({scaleMargins:{top:.85,bottom:0}});
  vs.setData(ohlc.map(d=>({time:d.time,value:d.volume||0,color:d.close>=d.open?'rgba(16,185,129,.3)':'rgba(239,68,68,.3)'})));

  const stDaily=stData.daily||stData||[];
  const stWeekly=stData.weekly||[];
  const stMonthly=stData.monthly||[];

  function drawSTLines(stArr){
    if(!stArr||!stArr.length)return;
    const od={};ohlc.forEach(d=>od[d.time]=1);
    const sf=stArr.filter(d=>d.value!=null&&od[d.time]);
    if(!sf.length)return;
    let segs=[],cur=[sf[0]];
    for(let i=1;i<sf.length;i++){
      if(sf[i].signal!==cur[cur.length-1].signal){segs.push(cur);cur=[cur[cur.length-1],sf[i]]}
      else cur.push(sf[i]);
    }
    if(cur.length)segs.push(cur);
    segs.forEach(seg=>{
      const color=seg[0].signal===1?'#10b981':'#ef4444';
      const ls=mainChart.addSeries(LineSeries,{color:color,lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
      ls.setData(seg.map(d=>({time:d.time,value:d.value})));
    });
  }

  function drawATRLine(stArr){
    if(!stArr||!stArr.length)return;
    const od={};ohlc.forEach(d=>od[d.time]=1);
    const valid=stArr.filter(d=>d.atr_value!=null&&od[d.time]);
    if(!valid.length)return;
    const ls=mainChart.addSeries(LineSeries,{color:'#f59e0b',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,lineStyle:2});
    ls.setData(valid.map(d=>({time:d.time,value:d.close!=null?d.close-d.atr_value:null})));
  }

  if(showST){
    if(currentTF==='1D') drawSTLines(stDaily);
    else if(currentTF==='1W') drawSTLines(stWeekly);
    else if(currentTF==='1M') drawSTLines(stMonthly);
  }
  if(showATR){
    const activeST=currentTF==='1D'?stDaily:currentTF==='1W'?stWeekly:stMonthly;
    drawATRLine(activeST);
  }

  const li=Math.max(0,ohlc.length-60);
  setTimeout(()=>{try{mainChart.timeScale().setVisibleLogicalRange({from:li,to:ohlc.length-1})}catch(e){}},200);
  const om={};ohlc.forEach((d,i)=>om[d.time]=ohlc[i]);
  const activeST=currentTF==='1D'?stDaily:currentTF==='1W'?stWeekly:stMonthly;
  const sm={};if(activeST)activeST.forEach(d=>sm[d.time]=d);
  mainChart.subscribeCrosshairMove(p=>{
    if(!p||!p.time){tip.style.display='none';return}
    const b=om[p.time];if(!b){tip.style.display='none';return}
    const i=ohlc.indexOf(b);
    const chg=i>0?((b.close/ohlc[i-1].close-1)*100):0;
    const si=sm[b.time];
    const sl=si&&si.value!=null?' | ST: '+si.value.toFixed(2):'';
    const atr=si&&si.atr_value!=null?' | ATR: '+si.atr_value.toFixed(2):'';
    const c=b.close>=b.open?'#10b981':'#ef4444';
    tip.innerHTML=`<span style="color:${c};font-weight:700">${b.time}</span> O:${b.open.toFixed(2)} H:${b.high.toFixed(2)} L:${b.low.toFixed(2)} C:<b>${b.close.toFixed(2)}</b> ${chg>=0?'+':''}${chg.toFixed(2)}%${sl}${atr}`;
    tip.style.display='block';
  });
  if(!showVol)vs.applyOptions({visible:false});
}

function loadEquityChart(){
  const box=document.getElementById('equityChartBox');
  box.innerHTML='<div style="padding:40px;text-align:center;color:var(--text-muted)">Loading equity curve...</div>';
  fetch('/api/portfolios/equity_ohlc?market='+MARKET+'&limit=1000&timeframe='+equityTF).then(r=>r.json()).then(ohlc=>{

}

    const c=b.close>=b.open?'#10b981':'#ef4444';
    tip.innerHTML=`<span style="color:${c};font-weight:700">${b.time}</span> O:${b.open.toFixed(2)} H:${b.high.toFixed(2)} L:${b.low.toFixed(2)} C:<b>${b.close.toFixed(2)}</b> ${chg>=0?'+':''}${chg.toFixed(2)}%`;

}

loadPortfolios();
loadMainChart();
</script>
