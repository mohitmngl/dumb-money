            <div class="position-item"><strong>Direction:</strong> ${isUp ? '▲ BULLISH' : '▼ BEARISH'}</div>
            <div class="position-item"><strong>Probability:</strong> ${pattern.probability.toFixed(0)}%</div>
            <div class="position-item"><strong>Confidence:</strong> ${pattern.confidence.toUpperCase()}</div>
            <div class="position-item"><strong>SL:</strong> $${pattern.sl.toFixed(2)}</div>
            <div class="position-item"><strong>Target:</strong> $${pattern.target.toFixed(2)}</div>
            <span class="position-rr ${rrClass}">R:R = ${rrRatio.toFixed(2)}</span>
        `;
        document.getElementById('positionInstructions').textContent =
            `Pattern detected: ${pattern.type.replace(/_/g, ' ')} | ${pattern.probability.toFixed(0)}% historical win rate | ${pattern.confidence} confidence`;
    }

    function runPatternDetection() {
        const btn = document.getElementById('btnPattern');
        btn.classList.toggle('active');

        if (btn.classList.contains('active')) {
            const pattern = detectPatterns();
            if (pattern) {
                renderPatternAnalysis(pattern);
                showPatternAnalysis(pattern);
            } else {
                document.getElementById('positionInfo').classList.add('active');
                document.getElementById('positionInstructions').textContent = 'No significant pattern detected in current timeframe';
                document.getElementById('positionRow').innerHTML = '';
            }
            drawChart();
        } else {
            // Remove pattern elements
            const existing = document.querySelector('.pattern-analysis');
            if (existing) existing.remove();
            document.getElementById('positionInfo').classList.remove('active');
            drawChart();
        }
    }

    // ── Mouse Wheel Zoom ──────────────────────────────────────────────
    document.addEventListener('wheel', (e) => {
        const wrapper = document.getElementById('chartWrapper');
        if (!wrapper) return;
        const rect = wrapper.getBoundingClientRect();
        if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) return;
        e.preventDefault();
        const delta = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        chartState.barWidth = Math.min(30, Math.max(1, chartState.barWidth * delta));
        chartState.candleGap = Math.min(10, Math.max(0.5, chartState.candleGap * delta));
        chartState.priceScale = Math.min(3, Math.max(0.5, chartState.priceScale * (e.deltaY < 0 ? 1.1 : 0.9)));
        drawChart();
    }, { passive: false });

    // ── Mouse Drag (Pan) ──────────────────────────────────────────────
    // Use wrapper-bound listeners + document for reliable pan
    document.addEventListener('mousedown', (e) => {
        const wrapper = document.getElementById('chartWrapper');
        if (!wrapper) return;
        if (e.target.closest('.chart-controls')) return;

        // Handle drawing mode clicks
        if (chartState.drawingMode === 'position') {
            handleDrawClick(e);
            return;
        }

        if (chartState.drawingMode === 'trendline') {
            const priceData = getPriceFromMouse(e);
            if (priceData) {
                chartState.isDragging = true;
                chartState.dragStartX = e.clientX;
                chartState.trendlineStart = priceData;
                wrapper.style.cursor = 'crosshair';
                // Bind move/up to document for reliable tracking outside wrapper
                const onMove = (ev) => {
                    const previewData = getPriceFromMouse(ev);
                    if (previewData && chartState.trendlineStart) {
                        drawChart();
                        renderTrendlinePreview(chartState.trendlineStart, previewData);
                    }
                };
                const onUp = (ev) => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    wrapper.style.cursor = 'crosshair';
                    if (chartState.trendlineStart) {
                        const priceData = getPriceFromMouse(ev);
                        if (priceData) {
                            chartState.drawings.push({
                                type: 'trendline',
                                start: chartState.trendlineStart,
                                end: priceData,
                            });
                        }
                    }
                    chartState.isDragging = false;
                    chartState.trendlineStart = null;
                    chartState.drawingMode = null;
                    document.getElementById('btnTrendline').classList.remove('active');
                    // Redraw chart (will render saved trendline + analysis panel)
                    drawChart();
                };
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            }
            return;
        }

        // Normal pan mode — must be inside chart wrapper
        const rect = wrapper.getBoundingClientRect();
        if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) return;

        chartState.isDragging = true;
        chartState.dragStartX = e.clientX;
        chartState.dragStartOffset = chartState.offset;
        wrapper.style.cursor = 'grabbing';
        wrapper.style.userSelect = 'none';

        const onMove = (ev) => {
            if (!chartState.isDragging) return;
            const dx = ev.clientX - chartState.dragStartX;
            const barWidth = chartState.barWidth + chartState.candleGap;
            const barsDragged = Math.round(dx / barWidth);
            const newOffset = Math.max(0, Math.min(visibleBars.length - 10, chartState.dragStartOffset - barsDragged));

            // Only redraw if offset actually changed
            if (newOffset !== chartState.offset) {
                chartState.offset = newOffset;

                // Load older bars if needed
                if (chartState.offset > visibleBars.length - 30 && allBars.length < totalBarsAvailable) {
                    loadOlderBars();
                }
                drawChart();
            }
        };

        const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            chartState.isDragging = false;
            wrapper.style.cursor = 'crosshair';
            wrapper.style.userSelect = '';
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    });

    // ── Touch Support ─────────────────────────────────────────────────
    let touchStartX = 0;
    let touchStartOffset = 0;
    let initialPinchDistance = 0;
    let initialPriceScale = 1;

    function getPinchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    document.addEventListener('touchstart', (e) => {
        const wrapper = document.getElementById('chartWrapper');
        if (!wrapper) return;
        const rect = wrapper.getBoundingClientRect();
        const touch = e.touches[0];
        if (touch.clientX < rect.left || touch.clientX > rect.right || touch.clientY < rect.top || touch.clientY > rect.bottom) return;
        if (e.target.closest('.chart-controls')) return;

        if (e.touches.length === 2) {
            // Pinch start
            initialPinchDistance = getPinchDistance(e.touches);
            initialPriceScale = chartState.priceScale;
        } else if (e.touches.length === 1) {
            // Single touch - pan
            touchStartX = e.touches[0].clientX;
            touchStartOffset = chartState.offset;
            chartState.isDragging = true;
        }
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
        const chart = document.getElementById('candleChart');
        if (!chart) return;

        if (e.touches.length === 2) {
            // Pinch zoom - scales both time and price
            const currentDistance = getPinchDistance(e.touches);
            const scale = currentDistance / initialPinchDistance;
            chartState.priceScale = Math.max(0.5, Math.min(3, initialPriceScale * scale));
            chartState.barWidth = Math.max(1, Math.min(30, 8 * scale));
            drawChart();
        } else if (chartState.isDragging && e.touches.length === 1) {
            const dx = e.touches[0].clientX - touchStartX;
            const barWidth = chartState.barWidth + chartState.candleGap;
            const barsDragged = Math.round(dx / barWidth);
            chartState.offset = Math.max(0, Math.min(visibleBars.length - 10, touchStartOffset - barsDragged));
            if (chartState.offset > visibleBars.length - 30 && allBars.length < totalBarsAvailable) {
                loadOlderBars();
            }
            drawChart();
        }
    }, { passive: true });

    document.addEventListener('touchend', () => {
        chartState.isDragging = false;
    });

    // ── Load Older Bars ───────────────────────────────────────────────
    async function loadOlderBars() {
        if (chartState.loadedOlder.has('all')) return;
        const key = allBars.length;
        if (chartState.loadedOlder.has(key)) return;
        chartState.loadedOlder.add(key);

        try {
            const res = await fetch(`/api/stock/${currentSymbol}/bars?offset=${allBars.length}&limit=200&dir=older`);
            const data = await res.json();
            if (data.bars && data.bars.length > 0) {
                allBars = [...data.bars, ...allBars];
                updateChartData();
                drawChart();
            } else {
                chartState.loadedOlder.add('all');
            }
        } catch (e) {
            console.error('Failed to load older bars:', e);
        }
    }

    // ── News & Sentiment ──────────────────────────────────────────────
    async function openNews() {
        const section = document.getElementById('newsSection');
        const body = document.getElementById('newsBody');
        section.style.display = 'block';
        body.innerHTML = '<div class="loading-cell">Analyzing news & social media...</div>';

        try {
            const res = await fetch(`/api/stock/${currentSymbol}`);
            const data = await res.json();
            const symbol = data.symbol;
            const name = data.name;

            // Search web for recent news
            const newsRes = await fetch(`/api/news-search?symbol=${symbol}&name=${encodeURIComponent(name)}`);
            const newsData = await newsRes.json();

            let html = '';

            // Summary
            html += `<div class="news-summary">
                <h4>Sentiment Overview</h4>
                <div class="sentiment-tags">
                    <span class="sentiment-tag bullish">Recent Activity</span>
                    <span class="sentiment-tag neutral">Mixed Signals</span>
                </div>
            </div>`;

            // News items
            if (newsData.articles && newsData.articles.length > 0) {
                html += '<div class="news-section"><h4>Recent News</h4><div class="news-list">';
                newsData.articles.forEach(a => {
                    html += `<div class="news-item">
                        <div class="news-headline"><a href="${a.url}" target="_blank" rel="noopener">${escapeHtml(a.title)}</a></div>
                        <div class="news-meta">${a.source} · ${a.timeAgo}</div>
                    </div>`;
                });
                html += '</div></div>';
            }

            // Social sentiment
            html += `<div class="news-section"><h4>Social Media Pulse</h4>
                <div class="social-pulse">
                    <div class="pulse-item">
                        <span class="pulse-platform">Reddit</span>
                        <span class="pulse-status">Active discussion</span>
                    </div>
                    <div class="pulse-item">
                        <span class="pulse-platform">X / Twitter</span>
                        <span class="pulse-status">Recent mentions</span>
                    </div>
                    <div class="pulse-item">
                        <span class="pulse-platform">Stock Forums</span>
                        <span class="pulse-status">Community interest</span>
                    </div>
                </div>
                <p class="social-note">Click a source above to explore real-time discussions about ${symbol}.</p>
            </div>`;

            body.innerHTML = html;
        } catch (e) {
            body.innerHTML = '<div class="empty-cell">Could not load news data</div>';
        }
    }

    function closeNews() {
        document.getElementById('newsSection').style.display = 'none';
    }

    function toggleSection(id) {
        const section = document.getElementById(id);
        if (section) {
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
        }
    }

    // ── AI Analysis ──────────────────────────────────────────────────
    function openAnalysis() {
        const section = document.getElementById('analysisSection');
        const body = document.getElementById('analysisBody');
        section.style.display = 'block';
        body.innerHTML = '<div class="loading-cell">Running AI analysis...</div>';
        loadAnalysis();
    }

    function closeAnalysis() {
        document.getElementById('analysisSection').style.display = 'none';
    }

    async function loadAnalysis() {
        const body = document.getElementById('analysisBody');
        try {
            const res = await fetch(`/api/stock/${currentSymbol}/analysis`);
            const data = await res.json();
            renderAnalysis(data);
        } catch (e) {
            body.innerHTML = '<div class="empty-cell">Could not load analysis</div>';
        }
    }

    function renderAnalysis(data) {
        const body = document.getElementById('analysisBody');
        const biasColor = data.bias === 'bullish' ? 'var(--green)' : data.bias === 'bearish' ? 'var(--red)' : 'var(--text-secondary)';
        const biasBg = data.bias === 'bullish' ? 'var(--green-bg)' : data.bias === 'bearish' ? 'var(--red-bg)' : 'rgba(0,0,0,0.05)';
        const scoreColor = data.overall_score >= 65 ? 'var(--green)' : data.overall_score <= 35 ? 'var(--red)' : 'var(--text-secondary)';
        const cachedTag = data.cached ? '<span style="font-size:11px;color:var(--text-tertiary);margin-left:8px">(cached)</span>' : '';

        // Score ring SVG
        const radius = 52;
        const circumference = 2 * Math.PI * radius;
        const offset = circumference - (data.overall_score / 100) * circumference;
        const dashColor = data.overall_score >= 65 ? '#00C805' : data.overall_score <= 35 ? '#FF3B30' : '#6E6E73';

        body.innerHTML = `
            <div class="analysis-container">
                <!-- Overall Score Ring -->
                <div class="analysis-score-ring">
                    <svg width="130" height="130" viewBox="0 0 130 130">
                        <circle cx="65" cy="65" r="${radius}" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="10"/>
                        <circle cx="65" cy="65" r="${radius}" fill="none" stroke="${dashColor}" stroke-width="10"
                            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
                            stroke-linecap="round" transform="rotate(-90 65 65)"
                            style="transition: stroke-dashoffset 0.8s ease"/>
                        <text x="65" y="60" text-anchor="middle" font-family="Outfit, sans-serif" font-size="28" font-weight="800" fill="${dashColor}">${data.overall_score.toFixed(0)}</text>
                        <text x="65" y="78" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="var(--text-secondary)">/ 100</text>
                    </svg>
                    <div class="analysis-badge" style="background:${biasBg};color:${biasColor}">${data.bias.toUpperCase()}</div>
                </div>

                <!-- Platform Scores -->
                <div class="analysis-platforms">
                    <div class="platform-card">
                        <div class="platform-header">
                            <span class="platform-name">Technical</span>
                            <span class="platform-score" style="color:${data.tech_score >= 60 ? 'var(--green)' : data.tech_score <= 40 ? 'var(--red)' : 'var(--text)'}">${data.tech_score.toFixed(0)}</span>
                        </div>
                        <div class="platform-bar"><div class="platform-bar-fill" style="width:${data.tech_score}%;background:${data.tech_score >= 60 ? 'var(--green)' : data.tech_score <= 40 ? 'var(--red)' : 'var(--text-secondary)'}"></div></div>
                    </div>
                    <div class="platform-card">
                        <div class="platform-header">
                            <span class="platform-name">Momentum</span>
                            <span class="platform-score" style="color:${data.momentum_score >= 60 ? 'var(--green)' : data.momentum_score <= 40 ? 'var(--red)' : 'var(--text)'}">${data.momentum_score.toFixed(0)}</span>
                        </div>
                        <div class="platform-bar"><div class="platform-bar-fill" style="width:${data.momentum_score}%;background:${data.momentum_score >= 60 ? 'var(--green)' : data.momentum_score <= 40 ? 'var(--red)' : 'var(--text-secondary)'}"></div></div>
                    </div>
                    <div class="platform-card">
                        <div class="platform-header">
                            <span class="platform-name">Volume</span>
                            <span class="platform-score" style="color:${data.volume_score >= 60 ? 'var(--green)' : data.volume_score <= 40 ? 'var(--red)' : 'var(--text)'}">${data.volume_score.toFixed(0)}</span>
                        </div>
                        <div class="platform-bar"><div class="platform-bar-fill" style="width:${data.volume_score}%;background:${data.volume_score >= 60 ? 'var(--green)' : data.volume_score <= 40 ? 'var(--red)' : 'var(--text-secondary)'}"></div></div>
                    </div>
                    <div class="platform-card">
                        <div class="platform-header">
                            <span class="platform-name">Events</span>
                            <span class="platform-score" style="color:${data.events_score >= 60 ? 'var(--green)' : data.events_score <= 40 ? 'var(--red)' : 'var(--text)'}">${data.events_score.toFixed(0)}</span>
                        </div>
                        <div class="platform-bar"><div class="platform-bar-fill" style="width:${data.events_score}%;background:${data.events_score >= 60 ? 'var(--green)' : data.events_score <= 40 ? 'var(--red)' : 'var(--text-secondary)'}"></div></div>
                    </div>
                </div>

                <!-- Signals -->
                <div class="analysis-signals">
                    <h4>Key Signals</h4>
                    <ul>
                        ${(data.signals || []).map(s => `<li>${escapeHtml(s)}</li>`).join('')}
                    </ul>
                </div>
            </div>
        `;
    }

    // ── Oldest Data Formatter ─────────────────────────────────────────
    function formatOldestData(dateStr) {
        if (!dateStr) return '—';
        try {
            const d = new Date(dateStr);
            const now = new Date();
            const months = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
            const years = Math.floor(months / 12);
            const remMonths = months % 12;
            if (years > 0 && remMonths > 0) return `${years}y ${remMonths}m`;
            if (years > 0) return `${years}y`;
            return `${remMonths}m`;
        } catch {
            return dateStr;
        }
    }

    // ── Utility Functions ──────────────────────────────────────────────
    function formatPrice(p) {
        if (p == null || isNaN(p)) return '—';
        if (p >= 1000) return p.toFixed(0);
        if (p >= 1) return p.toFixed(2);
        return p.toFixed(4);
    }

    function formatVolume(v) {
        if (!v || isNaN(v)) return '—';
        return v.toLocaleString('en-US');
    }

    function formatProfitStatus(status) {
        const map = {
            'profitable': 'Profitable',
            'loss_making': 'Loss Making',
            'growing': 'Growing',
            'declining': 'Declining',
        };
        return map[status] || status || 'N/A';
    }

    async function loadOptions() {
        const container = document.getElementById('optionsContainer');
        const btn = document.getElementById('btnOptions');
        if (container.style.display !== 'none') {
            container.style.display = 'none';
            btn.textContent = '&#9662; Options Chain';
            return;
        }
        container.style.display = 'block';
        container.innerHTML = '<div class="loading-cell">Loading options...</div>';
        btn.textContent = '&#9652; Options Chain';
        try {
            const res = await fetch('/api/options/' + currentSymbol);
            const data = await res.json();
            if (data.status !== 'ok' || !data.chains || data.chains.length === 0) {
                container.innerHTML = '<div style="padding:1rem;text-align:center;color:var(--text-tertiary);font-size:0.85rem">' + (data.message || 'No options data available') + '</div>';
                return;
            }
            let html = '<div style="font-size:0.75rem;color:var(--text-tertiary);margin-bottom:0.5rem">Nearest expirations — click to expand</div>';
            data.chains.forEach(ch => {
                const expDate = new Date(ch.expiration + 'T00:00:00');
                const label = (expDate.getMonth()+1)+'/'+expDate.getDate()+'/'+expDate.getFullYear();
                html += '<div style="border:1px solid var(--border);border-radius:6px;margin-bottom:0.5rem;overflow:hidden">';
                html += '<div style="padding:0.4rem 0.7rem;background:var(--surface);font-weight:600;font-size:0.75rem;cursor:pointer" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'\':\'none\'">' + label + '</div>';
                html += '<div style="display:none;overflow-x:auto">';
                html += '<table style="width:100%;border-collapse:collapse;font-size:0.7rem"><thead><tr>';
                html += '<th style="padding:0.3rem;text-align:center;background:var(--card-bg)">Calls</th>';
                html += '<th style="padding:0.3rem;text-align:center;background:var(--card-bg)">Strike</th>';
                html += '<th style="padding:0.3rem;text-align:center;background:var(--card-bg)">Puts</th>';
                html += '</tr></thead><tbody>';
                // Merge calls and puts by strike
                const allStrikes = new Set();
                ch.calls.forEach(c => allStrikes.add(c.strike));
                ch.puts.forEach(p => allStrikes.add(p.strike));
                const strikes = Array.from(allStrikes).sort((a,b)=>a-b);
                const callMap = {}, putMap = {};
                ch.calls.forEach(c => callMap[c.strike] = c);
                ch.puts.forEach(p => putMap[p.strike] = p);
                strikes.forEach(s => {
                    const call = callMap[s];
                    const put = putMap[s];
                    html += '<tr>';
                    html += '<td style="padding:0.2rem 0.3rem;text-align:center">' + (call ? '$' + call.bid + '/' + call.ask + ' <span style="color:var(--text-tertiary)">' + (call.volume||'—') + '</span>' : '') + '</td>';
                    html += '<td style="padding:0.2rem 0.3rem;text-align:center;font-weight:600">$' + s.toFixed(2) + '</td>';
                    html += '<td style="padding:0.2rem 0.3rem;text-align:center">' + (put ? '$' + put.bid + '/' + put.ask + ' <span style="color:var(--text-tertiary)">' + (put.volume||'—') + '</span>' : '') + '</td>';
                    html += '</tr>';
                });
                html += '</tbody></table></div></div>';
            });
            container.innerHTML = html;
        } catch(e) {
            container.innerHTML = '<div style="padding:1rem;text-align:center;color:var(--text-tertiary)">Error loading options: ' + e.message + '</div>';
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Resize handler
    window.addEventListener('resize', () => drawChart());

    // ── Live Price ─────────────────────────────────────────────────
    startLivePrices([currentSymbol], function(prices) {
        const p = prices[currentSymbol];
        if (!p || !p.price) return;
        const priceEl = document.getElementById('liveStockPrice');
        if (priceEl) {
            priceEl.textContent = '$' + p.price.toFixed(2);
            priceEl.style.color = 'var(--green)';
        }
    }, 1500);

    // Load
    loadStock(currentSymbol);
    </script>
