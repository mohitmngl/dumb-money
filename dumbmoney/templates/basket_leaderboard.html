{% extends "base.html" %}
{% block title %}Winning Strings Leaderboard - {{ market }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Winning Strings Leaderboard <span class="badge badge-info">{{ market }}</span></h1>
  <div class="flex-row">
    <button class="btn btn-sm" onclick="window.location.href='/{{ 'india/' if market == 'INDIA' else '' }}basket-screener/'">Back to Screener</button>
  </div>
</div>

<div class="filter-rail">
  <label>Sort by:</label>
  <select id="sortBy" onchange="loadLeaderboard()">
    <option value="total_return">Weighted Alpha</option>
    <option value="win_rate">P(Up) 1D</option>
    <option value="sharpe">Confluence</option>
    <option value="avg_return">Chg%</option>
    <option value="best_day">AI Matrix</option>
  </select>
  <label>Top:</label>
  <select id="topN" onchange="loadLeaderboard()">
    <option value="25">25</option>
    <option value="50" selected>50</option>
    <option value="100">100</option>
    <option value="200">200</option>
  </select>
  <label>Min Dates:</label>
  <input type="number" id="minDates" value="30" style="width:60px" onchange="loadLeaderboard()">
  <button class="btn btn-sm btn-primary" onclick="loadLeaderboard()">Refresh</button>
</div>

<div class="card mb-16" id="summaryCards" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
  <div class="card breadth-card"><div class="num" id="totalStrings">-</div><div class="lbl">Total Strings</div></div>
  <div class="card breadth-card"><div class="num text-up" id="avgWinRate">-</div><div class="lbl">Avg P(Up)</div></div>
  <div class="card breadth-card"><div class="num" id="avgSharpe">-</div><div class="lbl">Avg Confluence</div></div>
  <div class="card breadth-card"><div class="num text-up" id="avgReturn">-</div><div class="lbl">Avg Weighted Alpha</div></div>
</div>

<div class="card" style="padding:0;overflow:hidden">
  <div class="screener-table" id="leaderboardTable">
    <div class="loading" style="padding:40px"><div class="spinner"></div> Loading leaderboard...</div>
  </div>
</div>

<div id="pagination" class="pagination"></div>

<script>
let currentSort = 'total_return';

function escHtml(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function loadLeaderboard() {
  const sortBy = document.getElementById('sortBy').value;
  const topN = document.getElementById('topN').value;
  const minDates = document.getElementById('minDates').value;
  currentSort = sortBy;

  document.getElementById('leaderboardTable').innerHTML = '<div class="loading" style="padding:40px"><div class="spinner"></div> Computing leaderboard...</div>';

  fetch(`/api/basket-screener/leaderboard?market=${MARKET}&sort=${sortBy}&top=${topN}&min_dates=${minDates}`)
    .then(r => r.json())
    .then(d => {
      if (!d.data || d.data.length === 0) {
        document.getElementById('leaderboardTable').innerHTML = '<div class="empty-state"><h3>No data yet</h3><p>Generate basket strings and rebuild historical data first.</p></div>';
        return;
      }

      const data = d.data;
      const avgWR = data.reduce((s, r) => s + r.win_rate, 0) / data.length;
      const avgSh = data.reduce((s, r) => s + r.sharpe, 0) / data.length;
      const avgRet = data.reduce((s, r) => s + r.total_return, 0) / data.length;

      document.getElementById('totalStrings').textContent = d.total.toLocaleString();
      document.getElementById('avgWinRate').textContent = avgWR.toFixed(1) + '%';
      document.getElementById('avgSharpe').textContent = avgSh.toFixed(2);
      document.getElementById('avgReturn').textContent = (avgRet >= 0 ? '+' : '') + avgRet.toFixed(1) + '%';

      let html = '<table><thead><tr>';
      html += '<th style="width:50px">#</th>';
      html += '<th style="width:90px">String</th>';
      html += '<th style="width:220px">Expression</th>';
      html += '<th style="width:80px" onclick="sortLeaderboard(\'win_rate\')" class="sortable">P(Up) 1D</th>';
      html += '<th style="width:85px" onclick="sortLeaderboard(\'total_return\')" class="sortable">Wtd Alpha</th>';
      html += '<th style="width:80px" onclick="sortLeaderboard(\'sharpe\')" class="sortable">Confl.</th>';
      html += '<th style="width:80px" onclick="sortLeaderboard(\'avg_return\')" class="sortable">Chg%</th>';
      html += '<th style="width:70px">Streak</th>';
      html += '<th style="width:60px">AI</th>';
      html += '</tr></thead><tbody>';

      data.forEach((r, i) => {
        const prob = r.win_rate || 0;
        const probCls = prob >= 55 ? 'text-up' : prob < 45 ? 'text-down' : '';
        const wa = r.total_return || 0;
        const retCls = wa >= 0 ? 'text-up' : 'text-down';
        const conf = r.sharpe || 0;
        const confCls = conf >= 60 ? 'text-up' : conf < 40 ? 'text-down' : '';
        const chg = r.avg_return || 0;
        const chgCls = chg >= 0 ? 'text-up' : 'text-down';
        html += `<tr>`;
        html += `<td class="numeric">${i + 1}</td>`;
        html += `<td><a href="/${MARKET === 'INDIA' ? 'india/' : ''}basket-screener/string/${r.string_id}" target="_blank" style="color:var(--brand)">${r.string_id}</a></td>`;
        html += `<td style="font-size:11px;color:#aaa">${escHtml(r.expression)}</td>`;
        html += `<td class="numeric ${probCls}"><span class="heat-pill">${prob.toFixed(1)}</span></td>`;
        html += `<td class="numeric ${retCls}">${wa.toFixed(2)}</td>`;
        html += `<td class="numeric ${confCls}"><span class="heat-pill">${conf.toFixed(1)}</span></td>`;
        html += `<td class="numeric ${chgCls}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</td>`;
        html += `<td class="numeric">${r.n_dates > 0 ? r.n_dates : '-'}</td>`;
        html += `<td class="numeric">${r.avg_ai.toFixed(0)}</td>`;
        html += '</tr>';
      });

      html += '</tbody></table>';
      document.getElementById('leaderboardTable').innerHTML = html;
    })
    .catch(err => {
      document.getElementById('leaderboardTable').innerHTML = `<div class="empty-state"><h3>Failed to load</h3><p>${err.message}</p></div>`;
    });
}

function sortLeaderboard(key) {
  document.getElementById('sortBy').value = key;
  loadLeaderboard();
}

loadLeaderboard();
</script>
<style>
.sortable { cursor: pointer; }
.sortable:hover { color: var(--brand); }
</style>
{% endblock %}
