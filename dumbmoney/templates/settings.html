{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="page-header"><h1>Settings</h1></div>
<div class="card mb-16">
  <h4 class="mb-8">Alpaca API</h4>
  <div class="filter-rail">
    <label>API Key:</label><input type="password" id="setKey" style="width:300px" placeholder="PKX...">
    <label>API Secret:</label><input type="password" id="setSecret" style="width:300px" placeholder="Secret...">
    <label>Base URL:</label><input type="text" id="setBase" style="width:300px" value="https://paper-api.alpaca.markets">
    <button class="btn btn-primary btn-sm" onclick="saveAlpaca()">Save</button>
  </div>
</div>
<div class="card">
  <h4 class="mb-8">System</h4>
  <p class="text-muted" style="font-size:13px">Market: {{ market }} | Status: <span id="sysStatus">Checking...</span></p>
  <button class="btn btn-sm mt-16" onclick="checkHealth()">Check Health</button>
</div>
<script>
fetch('/api/settings/alpaca').then(r=>r.json()).then(d=>{document.getElementById('setBase').value=d.base_url||'';});
function saveAlpaca(){
  fetch('/api/settings/alpaca',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:document.getElementById('setKey').value,api_secret:document.getElementById('setSecret').value,base_url:document.getElementById('setBase').value})}).then(r=>r.json()).then(()=>showToast('Saved'));
}
function checkHealth(){fetch('/api/health').then(r=>r.json()).then(d=>{document.getElementById('sysStatus').textContent=d.status==='ok'?'Healthy':'Error';});}
checkHealth();
</script>
{% endblock %}
