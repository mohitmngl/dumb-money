{% extends "base.html" %}
{% block title %}String - {{ market }}{% endblock %}
{% block content %}
<style>
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .hero-card{background:var(--surface-solid);border:1px solid var(--border);border-radius:20px;padding:24px 32px;animation:fadeUp .4s ease;position:relative;overflow:hidden}
  .hero-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
  .hero-card.running::before{background:linear-gradient(90deg,#10b981,#34d399)}
  .hero-card.closed::before{background:linear-gradient(90deg,#ef4444,#f87171)}
  .hero-big{font-size:36px;font-weight:800;letter-spacing:-1.5px}
  .hero-sub{font-size:13px;color:var(--text-muted);margin-top:2px}
  .st-badge{position:absolute;top:16px;right:20px;padding:6px 14px;border-radius:10px;font-size:12px;font-weight:700;animation:fadeUp .6s ease}
  .st-badge.above{background:rgba(16,185,129,.12);color:#10b981;border:1px solid rgba(16,185,129,.2)}
  .st-badge.below{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
  .stat-pill{background:var(--surface-solid);border:1px solid var(--border);border-radius:12px;padding:12px 16px;animation:fadeUp .5s ease}
  .stat-pill .label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
  .stat-pill .value{font-size:20px;font-weight:700;margin-top:2px}
  .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  .modal-overlay.show{display:flex}
  .modal-box{background:var(--surface-solid);border:1px solid var(--border);border-radius:16px;width:500px;max-width:95vw;animation:fadeUp .3s ease}
  .modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .modal-body{padding:24px}
  .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
  .field-group{margin-bottom:14px}
  .field-label{font-size:12px;color:var(--text-muted);margin-bottom:4px;display:block}
  .field-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
  .btn-primary{background:var(--brand,#10b981);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer}
  .btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:12px}
  .pnl-up{color:#10b981}.pnl-down{color:#ef4444}
  .tf-btn{font-size:11px;padding:3px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text-muted);cursor:pointer;transition:all .15s}
  .tf-btn:hover{border-color:#666;color:var(--text)}
  .tf-btn.active{background:var(--brand,#10b981);color:#fff;border-color:var(--brand,#10b981)}
</style>

<div class="page-header">
  <div>
    <a href="/{{ 'india/' if market == 'INDIA' else '' }}portfolio/{{ pid }}" style="font-size:12px;color:var(--brand,#10b981);text-decoration:none">&larr; Portfolio</a>
    <h1 id="strName" class="hero-big" style="cursor:pointer" onclick="openEdit()"></h1>
    <div id="strSub" class="hero-sub"></div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn-ghost" onclick="openEdit()">Edit</button>
    <button class="btn-ghost" id="closeBtn" style="color:#ef4444;display:none" onclick="closeString()">Close</button>
  </div>
</div>

<div id="heroSection" class="hero-card mb-16" style="position:relative">
  <div id="stBadge" class="st-badge" style="display:none"></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:8px" id="heroStats"></div>
</div>

<div id="chartSection" class="card mb-16" style="overflow:hidden;border-radius:16px">
  <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)">
    <div style="display:flex;gap:4px">
      <button class="tf-btn active" data-tf="1D">1D</button>
      <button class="tf-btn" data-tf="1W">1W</button>
      <button class="tf-btn" data-tf="1M">1M</button>
    </div>
    <div style="width:1px;height:20px;background:var(--border)"></div>
    <button id="togST" class="btn-ghost active" style="font-size:11px"><span style="color:#10b981">&#9632;</span> ST</button>
    <button id="togATR" class="btn-ghost active" style="font-size:11px"><span style="color:#f59e0b">&#9632;</span> ATR</button>
    <button id="togVol" class="btn-ghost active" style="font-size:11px">Vol</button>
    <div style="width:1px;height:20px;background:var(--border)"></div>
    <label style="font-size:11px;color:var(--text-muted)">Period</label>
    <input id="stPeriod" type="number" min="1" max="50" value="14" style="width:44px;font-size:11px;padding:2px 4px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text)">
    <label style="font-size:11px;color:var(--text-muted)">Mult</label>
    <input id="stMult" type="number" min="0.1" max="5" step="0.1" value="2.0" style="width:44px;font-size:11px;padding:2px 4px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text)">
    <button class="btn-ghost" onclick="loadChart()" style="font-size:11px">Apply</button>
    <div style="flex:1"></div>
    <span style="font-size:11px;color:var(--text-muted)" id="barCount"></span>
  </div>
  <div id="mainChartWrap" style="position:relative;height:450px">
    <div id="mainChartBox" style="width:100%;height:100%"></div>
    <div id="chartTooltip" style="position:absolute;top:8px;left:12px;z-index:20;pointer-events:none;font-size:11px;font-family:monospace;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.82);color:#fff;display:none;white-space:nowrap"></div>
  </div>
</div>

<div class="section-title" style="font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:12px">Symbols</div>
<div id="symsGrid" class="card mb-16" style="overflow:hidden;border-radius:16px">
  <div id="symsContent" style="padding:16px"></div>
</div>

<!-- Edit String Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-header"><h3 style="margin:0;font-size:18px">Edit String</h3><button class="btn-ghost" onclick="hideModal('edit')" style="padding:4px 8px;font-size:18px">&times;</button></div>
    <div class="modal-body">
      <div class="field-group"><label class="field-label">String Name</label><input id="editName" class="field-input"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field-group"><label class="field-label">Entry Date</label><input id="editEntryDate" type="date" class="field-input"></div>
        <div class="field-group"><label class="field-label">Entry Price</label><input id="editEntryPrice" type="number" step="0.01" class="field-input"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field-group"><label class="field-label">Exit Date</label><input id="editExitDate" type="date" class="field-input"></div>
        <div class="field-group"><label class="field-label">Exit Price</label><input id="editExitPrice" type="number" step="0.01" class="field-input"></div>
      </div>
      <div class="field-group"><label class="field-label">Status</label><select id="editStatus" class="field-input"><option value="running">Running</option><option value="closed">Closed</option></select></div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="hideModal('edit')">Cancel</button>
      <button class="btn-primary" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<!-- Close String Modal -->
<div class="modal-overlay" id="closeStrModal">
  <div class="modal-box" style="width:400px">
    <div class="modal-header"><h3 style="margin:0;font-size:18px">Close String</h3><button class="btn-ghost" onclick="hideModal('closeStr')" style="padding:4px 8px;font-size:18px">&times;</button></div>
    <div class="modal-body">
      <div class="field-group"><label class="field-label">Exit Date</label><input id="closeExitDate" type="date" class="field-input"></div>
      <div class="field-group"><label class="field-label">Exit Price (total)</label><input id="closeExitPrice" type="number" step="0.01" class="field-input" placeholder="Total exit value"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="hideModal('closeStr')">Cancel</button>
      <button class="btn-primary" onclick="confirmCloseStr()">Close String</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const PID={{ pid }},PSID={{ psid }};
const{createChart,CandlestickSeries,LineSeries,HistogramSeries}=LightweightCharts;
let strData=null,mainChart=null,showST=true,showATR=true,showVol=true,currentTF='1D';
function fmt(n,d){d=d||2;return(n==null||n==='')?'-':Number(n).toFixed(d)}
function signedPct(n){n=Number(n);if(!Number.isFinite(n))return'-';return(n>=0?'+':'')+n.toFixed(2)+'%'}
function cur(){return MARKET==='INDIA'?'\u20B9':'$'}
function showModal(n){document.getElementById(n+'Modal').classList.add('show')}
function hideModal(n){document.getElementById(n+'Modal').classList.remove('show')}

function loadString(){
  fetch('/api/portfolio/string/'+PSID+'/detail?market='+MARKET).then(r=>r.json()).then(d=>{
    if(d.error){document.getElementById('strName').textContent='Not found';return}
    strData=d;
    const heroCard=document.getElementById('heroSection');
    heroCard.className='hero-card mb-16 '+(d.status||'running');
    document.getElementById('strName').textContent=d.name||'String #'+d.id;
    document.getElementById('strSub').textContent=(d.symbols?d.symbols.length:0)+' stocks | Entry: '+(d.entry_date||'-')+' @ '+cur()+(d.entry_price?Number(d.entry_price).toFixed(2):'-');
    document.getElementById('closeBtn').style.display=d.status==='closed'?'none':'inline-block';
    const pnl=((d.realised_pnl||0)+(d.unrealised_pnl||0));
    const pc=pnl>=0?'pnl-up':'pnl-down';
    const chgPct=d.change_pct||0;
    const chgAbs=chgPct&&d.current_value?(d.current_value*chgPct/100):0;
    document.getElementById('heroStats').innerHTML=[
      ['Current Value',cur()+(d.current_value||0).toLocaleString(undefined,{minimumFractionDigits:2}),''],
      ['Today',signedPct(chgPct)+' ('+(chgAbs>=0?'+':'')+cur()+Math.abs(chgAbs).toFixed(2)+')',chgPct>=0?'pnl-up':'pnl-down'],
      ['Invested',cur()+(d.entry_value||0).toLocaleString(undefined,{minimumFractionDigits:2}),''],
      ['P&L',signedPct(d.pnl_pct)+' ('+cur()+Math.abs(pnl).toFixed(2)+')',pc]
    ].map(c=>'<div class="stat-pill"><div class="label">'+c[0]+'</div><div class="value '+c[2]+'">'+c[1]+'</div></div>').join('');
    renderSymbols(d.symbols||[]);
    updateSTBadge(d);
  });
}

function updateSTBadge(d){
  const badge=document.getElementById('stBadge');
  if(!d.last_st||!d.last_close){badge.style.display='none';return}
  const above=d.last_close>=d.last_st;
  badge.className='st-badge '+(above?'above':'below');
  badge.innerHTML=(above?'&#9650; ABOVE':'&#9660; BELOW')+' ST';
  badge.style.display='block';
}

function renderSymbols(syms){
  const c=document.getElementById('symsContent');
  if(!syms.length){c.innerHTML='<div style="text-align:center;padding:24px;color:var(--text-muted)">No symbols</div>';return}
  const totalVal=syms.reduce((a,s)=>a+(s.current_price||0)*(s.qty||0),0);
  let h='<table style="width:100%;font-size:13px;border-collapse:collapse"><thead><tr style="border-bottom:1px solid var(--border);color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:1px">';
  h+='<th style="text-align:left;padding:8px">Symbol</th><th style="text-align:right;padding:8px">Price</th><th style="text-align:right;padding:8px">Qty</th><th style="text-align:right;padding:8px">Value</th><th style="text-align:right;padding:8px">Alloc</th><th style="text-align:right;padding:8px">Day Chg</th></tr></thead><tbody>';
  syms.forEach(s=>{
    const val=(s.current_price||0)*(s.qty||0);
    const alloc=totalVal>0?(val/totalVal*100):0;
    const chg=s.change_pct||0;
    const cc=chg>=0?'pnl-up':'pnl-down';
    h+=`<tr style="border-bottom:1px solid var(--border)"><td style="font-weight:700;padding:8px">${s.symbol}</td><td style="text-align:right;padding:8px">${cur()}${Number(s.current_price||0).toFixed(2)}</td><td style="text-align:right;padding:8px">${Number(s.qty||0).toFixed(4)}</td><td style="text-align:right;padding:8px">${cur()}${val.toFixed(2)}</td><td style="text-align:right;padding:8px">${alloc.toFixed(1)}%</td><td style="text-align:right;padding:8px" class="${cc}">${signedPct(chg)}</td></tr>`;
  });
  h+='</tbody></table>';
  c.innerHTML=h;
}

function openEdit(){
  document.getElementById('editName').value=strData?strData.name:'';
  document.getElementById('editEntryDate').value=strData?strData.entry_date||'':'';
  document.getElementById('editEntryPrice').value=strData?strData.entry_price||'':'';
  document.getElementById('editExitDate').value=strData?strData.exit_date||'':'';
  document.getElementById('editExitPrice').value=strData?strData.exit_price||'':'';
  document.getElementById('editStatus').value=strData?strData.status||'running':'running';
  showModal('edit');
}
function saveEdit(){
  fetch('/api/portfolio/string/edit',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({market:MARKET,portfolio_string_id:PSID,name:document.getElementById('editName').value,entry_date:document.getElementById('editEntryDate').value||null,entry_price:document.getElementById('editEntryPrice').value?Number(document.getElementById('editEntryPrice').value):null,exit_date:document.getElementById('editExitDate').value||null,exit_price:document.getElementById('editExitPrice').value?Number(document.getElementById('editExitPrice').value):null,status:document.getElementById('editStatus').value})
  }).then(()=>{hideModal('edit');loadString()});
}
function closeString(){
  document.getElementById('closeExitDate').value=new Date().toISOString().slice(0,10);
  document.getElementById('closeExitPrice').value='';
  showModal('closeStr');
}
function confirmCloseStr(){
  const xp=document.getElementById('closeExitPrice').value;
  if(!xp){alert('Exit price required');return}
  fetch('/api/portfolio/string/close',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({market:MARKET,portfolio_string_id:PSID,exit_date:document.getElementById('closeExitDate').value,exit_price:Number(xp)})
  }).then(()=>{hideModal('closeStr');loadString()});
}

function loadChart(){
  const stP=document.getElementById('stPeriod').value||14;
  const stM=document.getElementById('stMult').value||2.0;
  const box=document.getElementById('mainChartBox');
  box.innerHTML='<div style="padding:40px;text-align:center;color:var(--text-muted)">Loading chart...</div>';
  Promise.all([
    fetch('/api/portfolio/string/'+PSID+'/ohlc?market='+MARKET+'&limit=500&timeframe='+currentTF).then(r=>r.json()),
    fetch('/api/portfolio/string/'+PSID+'/supertrend?market='+MARKET+'&period='+stP+'&multiplier='+stM+'&timeframe='+currentTF).then(r=>r.json()),
    fetch('/api/portfolio/string/'+PSID+'/accel?market='+MARKET+'&timeframe='+currentTF).then(r=>r.json()),
  ]).then(([ohlc,stData,acc])=>{
    box.innerHTML='';
    document.getElementById('barCount').textContent=(ohlc?ohlc.length:0)+' bars';
    const stDaily=stData.daily||stData||[];
    const stWeekly=stData.weekly||[];
    const stMonthly=stData.monthly||[];
    renderMainChart(ohlc,stDaily,stWeekly,stMonthly);
  }).catch(err=>{console.error('CHART ERROR:',err);box.innerHTML='<div style="padding:40px;text-align:center;color:var(--text-muted)">No data: '+(err&&err.message||err)+'</div>'});
}

function getTC(){const d=document.documentElement.getAttribute('data-theme')==='dark';return{bg:d?'#131722':'#ffffff',txt:d?'#d1d4dc':'#333',grid:d?'rgba(42,46,57,.6)':'rgba(0,0,0,.06)'}}

function renderMainChart(ohlc,stDaily,stWeekly,stMonthly){
  if(!ohlc||!ohlc.length){document.getElementById('mainChartBox').innerHTML='<div style="padding:40px;text-align:center;color:var(--text-muted)">No data</div>';return}
  stDaily=stDaily||[];stWeekly=stWeekly||[];stMonthly=stMonthly||[];
  if(mainChart){mainChart.remove();mainChart=null}
  const tc=getTC(),box=document.getElementById('mainChartBox'),tip=document.getElementById('chartTooltip');
  mainChart=createChart(box,{width:box.clientWidth,height:450,autoSize:true,layout:{background:{type:'solid',color:tc.bg},textStyle:{color:tc.txt,fontFamily:'system-ui'}},grid:{vertLines:{color:tc.grid},horzLines:{color:tc.grid}},crosshair:{mode:0},rightPriceScale:{borderVisible:false,autoScale:true,scaleMargins:{top:.08,bottom:.18}},timeScale:{timeVisible:false,secondsVisible:false,borderVisible:false}});
  const cs=mainChart.addSeries(CandlestickSeries,{upColor:'#10b981',downColor:'#ef4444',borderVisible:false,wickUpColor:'#10b981',wickDownColor:'#ef4444'});
  cs.setData(ohlc.map(d=>({time:d.time,open:d.open,high:d.high,low:d.low,close:d.close})));
  const vs=mainChart.addSeries(HistogramSeries,{priceFormat:{type:'volume'},priceScaleId:'vol'});
  mainChart.priceScale('vol').applyOptions({scaleMargins:{top:.85,bottom:0}});
  vs.setData(ohlc.map(d=>({time:d.time,value:d.volume||0,color:d.close>=d.open?'rgba(16,185,129,.3)':'rgba(239,68,68,.3)'})));

  function drawSTLines(stArr){
    if(!stArr||!stArr.length)return;
    const od={};ohlc.forEach(d=>od[d.time]=1);
    const sf=stArr.filter(d=>d.value!=null&&od[d.time]);
    if(!sf.length)return;
    let segs=[],cur=[sf[0]];
    for(let i=1;i<sf.length;i++){
      if(sf[i].signal!==cur[cur.length-1].signal){segs.push(cur);cur=[cur[cur.length-1],sf[i]]}
      else cur.push(sf[i]);
    }
    if(cur.length)segs.push(cur);
    segs.forEach(seg=>{
      const color=seg[0].signal===1?'#10b981':'#ef4444';
      const ls=mainChart.addSeries(LineSeries,{color:color,lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
      ls.setData(seg.map(d=>({time:d.time,value:d.value})));
    });
  }
  if(currentTF==='1D') drawSTLines(stDaily);
  else if(currentTF==='1W') drawSTLines(stWeekly);
  else if(currentTF==='1M') drawSTLines(stMonthly);

  // Draw ATR line
  const activeST=currentTF==='1D'?stDaily:currentTF==='1W'?stWeekly:stMonthly;
  if(activeST&&activeST.length){
    const od={};ohlc.forEach(d=>od[d.time]=1);
    const atrValid=activeST.filter(d=>d.atr_value!=null&&od[d.time]);
    if(atrValid.length){
      const atrLine=mainChart.addSeries(LineSeries,{color:'#f59e0b',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,lineStyle:2});
      atrLine.setData(atrValid.map(d=>({time:d.time,value:d.close!=null?d.close-d.atr_value:null})));
    }
  }

  const li=Math.max(0,ohlc.length-60);
  setTimeout(()=>{try{mainChart.timeScale().setVisibleLogicalRange({from:li,to:ohlc.length-1})}catch(e){}},200);
  const om={};ohlc.forEach((d,i)=>om[d.time]=ohlc[i]);
  const sm={};if(activeST)activeST.forEach(d=>sm[d.time]=d);
  mainChart.subscribeCrosshairMove(p=>{
    if(!p||!p.time){tip.style.display='none';return}
    const b=om[p.time];if(!b){tip.style.display='none';return}
    const i=ohlc.indexOf(b);
    const chg=i>0?((b.close/ohlc[i-1].close-1)*100):0;
    const si=sm[b.time];
    const sl=si&&si.value!=null?' | ST: '+si.value.toFixed(2):'';
    const atr=si&&si.atr_value!=null?' | ATR: '+si.atr_value.toFixed(2):'';
    const c=b.close>=b.open?'#10b981':'#ef4444';
    tip.innerHTML=`<span style="color:${c};font-weight:700">${b.time}</span> O:${b.open.toFixed(2)} H:${b.high.toFixed(2)} L:${b.low.toFixed(2)} C:<b>${b.close.toFixed(2)}</b> ${chg>=0?'+':''}${chg.toFixed(2)}%${sl}${atr}`;
    tip.style.display='block';
  });
  if(!showVol)vs.applyOptions({visible:false});
}

document.getElementById('togST').addEventListener('click',function(){showST=!showST;this.classList.toggle('active')});
document.getElementById('togATR').addEventListener('click',function(){showATR=!showATR;this.classList.toggle('active')});
document.getElementById('togVol').addEventListener('click',function(){showVol=!showVol;this.classList.toggle('active');loadChart()});
document.querySelectorAll('.tf-btn').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('.tf-btn').forEach(function(b){b.classList.remove('active')});btn.classList.add('active');currentTF=btn.dataset.tf;loadChart()})});
document.querySelectorAll('.modal-overlay').forEach(m=>{m.addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')})});
loadString();loadChart();
</script>
{% endblock %}
