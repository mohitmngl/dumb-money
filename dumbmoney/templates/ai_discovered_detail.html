{% extends "base.html" %}
{% block title %}AI Strategy Detail{% endblock %}
{% block content %}
<div class="page-header"><h1 id="aiName">AI Strategy</h1></div>
<div class="stat-cards-row mb-16" id="statCards"></div>
<div class="card mb-16"><h4 class="mb-8">Batches</h4><div id="batchesTable"></div></div>
<script>
const PID={{pid}};
function loadDetail(){
  fetch(`/api/ai-discovered/${PID}?market=${MARKET}`).then(r=>r.json()).then(d=>{
    const p=d.portfolio||{};
    document.getElementById('aiName').textContent=p.name||'Strategy';
    document.getElementById('statCards').innerHTML=`
      <div class="stat-card"><div class="label">Score</div><div class="value">${(p.score||0).toFixed(1)}</div></div>
      <div class="stat-card"><div class="label">Win Rate</div><div class="value">${(p.win_rate||0).toFixed(1)}%</div></div>
      <div class="stat-card"><div class="label">Avg Return</div><div class="value">${(p.avg_return||0).toFixed(3)}%</div></div>
      <div class="stat-card"><div class="label">Batches</div><div class="value">${p.total_batches||0}</div></div>
    `;
    const batches=d.batches||[];
    if(batches.length){
      let html='<table><thead><tr><th>Date</th><th>Symbols</th><th>Return 7d</th><th>Return 14d</th><th>Return 30d</th></tr></thead><tbody>';
      batches.forEach(b=>{
        html+=`<tr><td>${b.batch_date}</td><td style="max-width:300px;overflow:hidden;text-overflow:ellipsis">${b.symbols}</td><td class="numeric">${(b.avg_return_7d||0).toFixed(3)}%</td><td class="numeric">${(b.avg_return_14d||0).toFixed(3)}%</td><td class="numeric">${(b.avg_return_30d||0).toFixed(3)}%</td></tr>`;
      });
      html+='</tbody></table>';
      document.getElementById('batchesTable').innerHTML=html;
    } else {
      document.getElementById('batchesTable').innerHTML='<p class="text-muted">No batches yet.</p>';
    }
  });
}
loadDetail();
</script>
{% endblock %}
