<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Chart Test</title>
<script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body style="margin:0;background:#131722;color:#d1d4dc">
<div id="chart" style="width:100%;height:500px"></div>
<div id="msg"></div>
<script>
try {
  var LC = LightweightCharts;
  var chart = LC.createChart(document.getElementById('chart'), {width:800,height:500});
  var cs = chart.addSeries(LC.CandlestickSeries, {upColor:'#10b981',downColor:'#ef4444',borderVisible:false,wickUpColor:'#10b981',wickDownColor:'#ef4444'});
  cs.setData([
    {time:'2026-07-15',open:426.7,high:436.3,low:414.0,close:418.8},
    {time:'2026-07-16',open:423.5,high:432.6,low:414.7,close:421.7},
    {time:'2026-07-17',open:415.8,high:426.3,low:400.1,close:409.8},
    {time:'2026-07-20',open:416.9,high:420.9,low:403.0,close:406.7},
    {time:'2026-07-21',open:410.7,high:422.7,low:400.6,close:417.8}
  ]);
  chart.timeScale().fitContent();
  document.getElementById('msg').textContent='Chart v'+LC.version()+' OK';
} catch(e) {
  document.getElementById('msg').textContent='ERROR: '+e.message+' '+e.stack;
  document.getElementById('msg').style.color='red';
}
</script>
</body>
</html>
