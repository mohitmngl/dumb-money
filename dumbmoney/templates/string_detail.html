{% extends "base.html" %}
{% block title %}String Detail{% endblock %}
{% block content %}
<div class="page-header">
  <h1 id="stringName">String</h1>
  <div class="stat-cards-row" style="gap:8px;margin:0" id="headerCards"></div>
  <button class="btn btn-sm btn-danger" onclick="deleteString()">Delete</button>
</div>
<div class="stat-cards-row mb-16" id="statCards"></div>
<div class="chart-card card mb-16">
  <div class="chart-toolbar">
    <span class="text-muted" style="font-size:12px" id="barCount"></span>
  </div>
  <div id="chartContainer" style="min-height:500px;overflow-x:auto"><div class="loading"><div class="spinner"></div></div></div>
  <div id="accelPane" style="min-height:140px;overflow-x:auto"></div>
</div>
<div class="card mb-16"><h4 class="mb-8">Members</h4><div id="membersTable"></div></div>
<script>
const SID = {{ sid }};

function drawChart(ohlc, st, acc) {
  if (!ohlc || !ohlc.length) {
    document.getElementById('chartContainer').innerHTML = '<div class="empty-state"><h3>No data</h3></div>';
    return;
  }
  const n=ohlc.length;
  const barW=14, cW=Math.max(1,barW-2);
  const pad={t:20,r:60,b:50,l:20};
  const w=Math.max(900, n*barW+pad.l+pad.r+20);
  const h=500, ch=h-pad.t-pad.b;
  const highs=ohlc.map(d=>d.high), lows=ohlc.map(d=>d.low);
  (st||[]).forEach(d=>{ if(d.supertrend!=null){ highs.push(d.supertrend); lows.push(d.supertrend); }});
  let pMax=Math.max(...highs), pMin=Math.min(...lows);
  const pr0=pMax-pMin||1; pMax+=pr0*0.05; pMin-=pr0*0.05; const pr=pMax-pMin;
  const cw=w-pad.l-pad.r;
  const yOf=p=>pad.t+(pMax-p)/pr*ch;
  const stMap={}, accMap={};
  (st||[]).forEach(d=>{stMap[d.date]=d;});
  (acc||[]).forEach(d=>{accMap[d.date]=d;});
  let svg=`<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;height:${h}px;display:block;background:#fff">`;
  ohlc.forEach((bar,i)=>{
    const x=pad.l+i*barW+1,o=bar.open,hi=bar.high,lo=bar.low,c=bar.close,up=c>=o,col=up?'#10b981':'#ef4444';
    svg+=`<line x1="${x+cW/2}" y1="${yOf(hi)}" x2="${x+cW/2}" y2="${yOf(lo)}" stroke="${col}" stroke-width="1"/>`;
    svg+=`<rect x="${x}" y="${yOf(Math.max(o,c))}" width="${cW}" height="${Math.max(1,yOf(Math.min(o,c))-yOf(Math.max(o,c)))}" fill="${col}" rx="1"/>`;
  });
  let px=null,py=null;
  ohlc.forEach((bar,i)=>{
    const d=stMap[bar.date];
    if(d&&d.supertrend!=null){
      const x=pad.l+i*barW+cW/2,y=yOf(d.supertrend);
      if(px!=null) svg+=`<line x1="${px}" y1="${py}" x2="${x}" y2="${y}" stroke="${d.trend===1?'#10b981':'#ef4444'}" stroke-width="2"/>`;
      px=x; py=y;
      if(d.signal){
        const label=d.signal===1?'ST+':'ST-';
        svg+=`<text x="${x}" y="${d.signal===1?y-10:y+16}" text-anchor="middle" fill="${d.signal===1?'#10b981':'#ef4444'}" font-size="9" font-weight="700">${label}</text>`;
      }
    }
    const a=accMap[bar.date];
    if(a&&(a.crossed_up||a.crossed_down)){
      const x=pad.l+i*barW+cW/2,y=yOf(bar.close),fill=a.crossed_up?'#2563eb':'#f97316';
      svg+=`<circle cx="${x}" cy="${a.crossed_up?y-14:y+14}" r="5" fill="${fill}"/>`;
    }
  });
  svg+=`</svg>`;
  document.getElementById('chartContainer').innerHTML=svg;
  const container=document.getElementById('chartContainer');
  setTimeout(function(){ container.scrollLeft=container.scrollWidth; },200);
  drawAccelPane(ohlc, acc);
}

function drawAccelPane(ohlc, acc) {
  const pane=document.getElementById('accelPane');
  const dates=new Set((ohlc||[]).map(d=>d.date));
  const rows=(acc||[]).filter(d=>dates.has(d.date)&&d.accel_a!=null&&d.accel_base!=null);
  if(!rows.length){ pane.innerHTML=''; return; }
  const n=rows.length;
  const pad={t:14,r:60,b:22,l:28};
  const w=Math.max(900, n*14+pad.l+pad.r+20);
  const h=140,cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
  const vals=rows.flatMap(d=>[d.accel_a,d.accel_base]).filter(Number.isFinite);
  let vMax=Math.max(...vals),vMin=Math.min(...vals); const vr0=vMax-vMin||0.01; vMax+=vr0*.1; vMin-=vr0*.1; const vr=vMax-vMin||1;
  const xOf=i=>pad.l+(rows.length<=1?0:i*cw/(rows.length-1)), yOf=v=>pad.t+(vMax-v)/vr*ch;
  let svg=`<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;height:${h}px;display:block;background:#fff;border-top:1px solid #e5e7eb">`;
  svg+=`<text x="${pad.l}" y="11" fill="#374151" font-size="10" font-weight="700">Accel A/Base</text>`;
  ['accel_a','accel_base'].forEach((key,idx)=>{let path='';rows.forEach((d,i)=>{path+=`${i?'L':'M'}${xOf(i).toFixed(2)},${yOf(d[key]).toFixed(2)}`;});svg+=`<path d="${path}" fill="none" stroke="${idx?'#f97316':'#2563eb'}" stroke-width="1.7"/>`;});
  rows.forEach((d,i)=>{if(d.crossed_up||d.crossed_down)svg+=`<circle cx="${xOf(i)}" cy="${yOf(d.crossed_up?d.accel_a:d.accel_base)}" r="4" fill="${d.crossed_up?'#2563eb':'#f97316'}"/>`;});
  svg+=`</svg>`; pane.innerHTML=svg;
  setTimeout(function(){ pane.scrollLeft=pane.scrollWidth; },200);
}

function loadString() {
  Promise.all([
    fetch(`/api/strings/${SID}/ohlc?market=${MARKET}`).then(r=>r.json()),
    fetch(`/api/strings/${SID}/supertrend?market=${MARKET}`).then(r=>r.json()),
    fetch(`/api/strings/${SID}/accel?market=${MARKET}`).then(r=>r.json()),
    fetch(`/api/strings/${SID}/detail?market=${MARKET}`).then(r=>r.json())
  ]).then(([ohlc, st, acc, detail]) => {
    document.getElementById('stringName').textContent = (detail.name || 'String #' + SID);
    const chg = detail.change_pct || 0;
    const prefix = MARKET === 'INDIA' ? 'Rs ' : '$';
    document.getElementById('headerCards').innerHTML =
      `<div class="stat-card"><div class="label">Value</div><div class="value">${prefix}${(detail.price||0).toFixed(2)}</div></div>` +
      `<div class="stat-card"><div class="label">Chg%</div><div class="value ${chg>=0?'up':'down'}">${chg>=0?'+':''}${chg.toFixed(2)}%</div></div>` +
      `<div class="stat-card"><div class="label">Wtd Alpha</div><div class="value">${(detail.weighted_alpha||0).toFixed(2)}</div></div>` +
      `<div class="stat-card"><div class="label">Stocks</div><div class="value">${detail.num_stocks||0}</div></div>`;
    document.getElementById('barCount').textContent = ohlc.length + ' bars';
    document.getElementById('statCards').innerHTML =
      `<div class="stat-card"><div class="label">Bars</div><div class="value">${ohlc.length}</div></div>` +
      `<div class="stat-card"><div class="label">ST Crosses</div><div class="value">${(st||[]).filter(d=>d.signal).length}</div></div>` +
      `<div class="stat-card"><div class="label">Accel Crosses</div><div class="value">${(acc||[]).filter(d=>d.crossed_up||d.crossed_down).length}</div></div>`;
    drawChart(ohlc, st, acc);
  });
}
function deleteString() {
  if (!confirm('Delete?')) return;
  fetch(`/api/strings/${SID}?market=${MARKET}`,{method:'DELETE'}).then(()=>{showToast('Deleted');window.location.href=`/${MARKET==='INDIA'?'india/':''}string-screener/`;});
}
loadString();
</script>
{% endblock %}
