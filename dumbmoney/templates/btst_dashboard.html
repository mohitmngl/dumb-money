{% extends "base.html" %}
{% block title %}BTST Dashboard - {{ market }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>BTST Dashboard <span class="badge badge-info">{{ market }}</span></h1>
  <div class="flex-row">
    <select id="pickLimit" onchange="loadBTST()">
      <option value="25">Top 25</option>
      <option value="50">Top 50</option>
      <option value="100">Top 100</option>
    </select>
    <button class="btn btn-sm" onclick="loadBTST()">Refresh View</button>
  </div>
</div>

<div class="stat-cards-row mb-16" id="summaryCards"></div>

<div class="card mb-16" style="padding:0;overflow:hidden">
  <div class="flex-between" style="padding:12px 14px;border-bottom:1px solid var(--border)">
    <h4>Highest Probability Stocks For Next Session</h4>
    <span class="text-muted" style="font-size:12px" id="stockNote"></span>
  </div>
  <div id="stockPicks"><div class="loading" style="padding:40px"><div class="spinner"></div></div></div>
</div>

<div class="card" style="padding:0;overflow:hidden">
  <div class="flex-between" style="padding:12px 14px;border-bottom:1px solid var(--border)">
    <h4>Highest Probability Strings / Strategies</h4>
    <span class="text-muted" style="font-size:12px" id="stringNote"></span>
  </div>
  <div id="stringPicks"><div class="loading" style="padding:40px"><div class="spinner"></div></div></div>
</div>

<script>
const PRICE_PREFIX = MARKET === 'INDIA' ? 'Rs ' : '$';

function fmtPct(v, digits=2) {
  v = Number(v || 0);
  return (v >= 0 ? '+' : '') + v.toFixed(digits) + '%';
}

function scoreBadge(score) {
  const cls = score >= 70 ? 'badge-up' : score >= 55 ? 'badge-info' : 'badge-down';
  return `<span class="badge ${cls}">${Number(score || 0).toFixed(1)}</span>`;
}

function renderStocks(rows) {
  if (!rows.length) {
    document.getElementById('stockPicks').innerHTML = '<div class="empty-state"><h3>No stock picks</h3></div>';
    return;
  }
  let html = '<table><thead><tr><th>Rank</th><th>Symbol</th><th>Score</th><th>Price</th><th>Chg%</th><th>P(Up)</th><th>WA</th><th>Volume</th><th>ST</th><th>Accel</th><th>Why</th></tr></thead><tbody>';
  rows.forEach((r, i) => {
    const st = r.atr_crossed_above ? 'ST Cross Up' : r.atr_crossed_below ? 'ST Cross Down' : r.atr_signal === 1 ? 'UP' : r.atr_signal === -1 ? 'DOWN' : '-';
    const acc = r.accel_crossed_up ? 'Accel Up' : r.accel_crossed_down ? 'Accel Down' : r.accel_signal === 1 ? 'UP' : r.accel_signal === -1 ? 'DOWN' : '-';
    html += `<tr>
      <td class="numeric">${i + 1}</td>
      <td><a href="/${MARKET==='INDIA'?'india/':''}stock/${r.symbol}" target="_blank">${r.symbol}</a><div class="text-muted" style="font-size:11px">${r.name || ''}</div></td>
      <td>${scoreBadge(r.btst_score)}</td>
      <td class="numeric">${PRICE_PREFIX}${Number(r.price || 0).toFixed(2)}</td>
      <td class="numeric ${(r.change_pct||0)>=0?'text-up':'text-down'}">${fmtPct(r.change_pct)}</td>
      <td class="numeric">${Number(r.prob_up_1d || 0).toFixed(1)}%</td>
      <td class="numeric ${(r.weighted_alpha||0)>=0?'text-up':'text-down'}">${Number(r.weighted_alpha || 0).toFixed(2)}</td>
      <td class="numeric">${Number(r.volume || 0).toLocaleString()}</td>
      <td>${st}</td>
      <td>${acc}</td>
      <td style="font-size:11px">${(r.why || []).join(', ') || '-'}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('stockPicks').innerHTML = html;
}

function renderStrings(rows) {
  if (!rows.length) {
    document.getElementById('stringPicks').innerHTML = '<div class="empty-state"><h3>No string strategies yet</h3><p>Run String Screener backtest to generate strategy candidates.</p></div>';
    return;
  }
  let html = '<table><thead><tr><th>Rank</th><th>Strategy</th><th>Score</th><th>P(Up)</th><th>Win Rate</th><th>Avg 1D</th><th>Sharpe</th><th>Entries</th><th>Current Symbols</th></tr></thead><tbody>';
  rows.forEach((r, i) => {
    const symbols = (r.symbols || []).slice(0, 12).join(', ');
    html += `<tr>
      <td class="numeric">${i + 1}</td>
      <td><a href="/${MARKET==='INDIA'?'india/':''}string-screener/strategy/${r.id}">${r.name}</a></td>
      <td>${scoreBadge(r.btst_score)}</td>
      <td class="numeric">${Number(r.prob_up_1d || 0).toFixed(1)}%</td>
      <td class="numeric">${Number(r.win_rate || 0).toFixed(1)}%</td>
      <td class="numeric ${(r.avg_1d_return||0)>=0?'text-up':'text-down'}">${fmtPct(r.avg_1d_return, 3)}</td>
      <td class="numeric">${Number(r.sharpe_1d || 0).toFixed(3)}</td>
      <td class="numeric">${Number(r.total_entries || 0).toLocaleString()}</td>
      <td style="font-size:11px">${symbols}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('stringPicks').innerHTML = html;
}

function loadBTST() {
  const limit = document.getElementById('pickLimit').value;
  fetch(`/api/btst-dashboard?market=${MARKET}&limit=${limit}`).then(r => r.json()).then(d => {
    const stocks = d.stocks || [];
    const strings = d.strings || [];
    document.getElementById('summaryCards').innerHTML = `
      <div class="stat-card"><div class="label">Stock Picks</div><div class="value">${stocks.length}</div></div>
      <div class="stat-card"><div class="label">Top Stock Score</div><div class="value">${stocks.length ? Number(stocks[0].btst_score).toFixed(1) : '-'}</div></div>
      <div class="stat-card"><div class="label">String Picks</div><div class="value">${strings.length}</div></div>
      <div class="stat-card"><div class="label">Top String Score</div><div class="value">${strings.length ? Number(strings[0].btst_score).toFixed(1) : '-'}</div></div>
    `;
    document.getElementById('stockNote').textContent = d.notes && d.notes.stocks ? d.notes.stocks : '';
    document.getElementById('stringNote').textContent = d.notes && d.notes.strings ? d.notes.strings : '';
    renderStocks(stocks);
    renderStrings(strings);
  }).catch(() => {
    document.getElementById('stockPicks').innerHTML = '<div class="empty-state"><h3>Failed to load BTST picks</h3></div>';
    document.getElementById('stringPicks').innerHTML = '';
  });
}

loadBTST();
</script>
{% endblock %}
