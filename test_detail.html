<div class="card mb-16" id="refreshPanel" style="display:none;position:fixed;top:70px;right:20px;z-index:1000;width:340px;box-shadow:0 4px 20px rgba(0,0,0,0.15)">

      <div>

      </div>
    </div>

      <span class="text-muted" style="font-size:12px" id="refreshETA"></span>
      <button class="btn btn-sm btn-danger" id="cancelBtn" onclick="cancelRefresh()">Cancel</button>
    </div>
  </div>

  </div>
  <div class="flex-between mt-16" style="font-size:12px">

  </div>

<div id="toast" class="toast" style="display:none"></div>
<script>
document.getElementById('globalSearch').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && this.value.trim()) {
    window.location.href = '/' + (MARKET === 'INDIA' ? 'india/' : '') + 'stock/' + this.value.trim().toUpperCase();
  }
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

let refreshInterval;
function startRefresh() {
  fetch('/api/refresh', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({market: MARKET})
  }).then(r => r.json()).then(d => {
    if (d.started) {
      showToast('Refresh started');
      document.getElementById('refreshPanel').style.display = 'block';
      document.getElementById('refreshSpinner').style.display = 'block';
      document.getElementById('refreshStep').textContent = 'Starting refresh...';
      if (!refreshInterval) refreshInterval = setInterval(pollRefresh, 2000);
    }
  }).catch(() => {});
}

function pollRefresh() {
  fetch('/api/refresh/status?market=' + encodeURIComponent(MARKET)).then(r => r.json()).then(d => {
    updateRefreshPanel(d);
    if (d.status === 'complete') {
      clearInterval(refreshInterval);
      refreshInterval = null;
      document.getElementById('refreshPanel').style.display = 'none';
      showToast('Refresh complete!');
      loadSidebarStats();
      if (typeof loadScreener === 'function') loadScreener();
      if (typeof loadBreadth === 'function') loadBreadth();
      if (typeof loadTopLists === 'function') loadTopLists();
      setTimeout(() => location.reload(), 1500);
    } else if (d.status === 'running') {
      var nc = d.new_stocks_count || 0;
      if (nc > 0) {
        document.getElementById('statNew').textContent = 'New IPOs: ' + nc + ' (downloading...)';
      }
    } else if (d.status === 'error') {
      clearInterval(refreshInterval);
      refreshInterval = null;
      document.getElementById('refreshSpinner').style.display = 'none';
      showToast('Refresh failed: ' + (d.phase || 'Unknown error'));
    } else if (d.status === 'cancelled' || d.status === 'idle') {
      clearInterval(refreshInterval);
      refreshInterval = null;
      document.getElementById('refreshPanel').style.display = 'none';
    }
  }).catch(() => {});
}

function updateRefreshPanel(d) {
  const panel = document.getElementById('refreshPanel');
  const spinner = document.getElementById('refreshSpinner');
  if (!panel) return;
  if (d.status === 'complete') {
    spinner.style.display = 'none';
    panel.style.display = 'none';
    return;
  }
  spinner.style.display = d.status === 'running' ? 'block' : 'none';
  panel.style.display = 'block';
  document.getElementById('refreshStep').textContent = d.step_name || 'Starting...';
  document.getElementById('refreshPhase').textContent = d.phase || '';
  document.getElementById('refreshBar').style.width = (d.overall_pct || 0) + '%';
  const total = d.symbols_total || 0;
  const done = d.symbols_done || 0;
  document.getElementById('refreshSymbols').textContent = total > 0 ? done.toLocaleString() + ' / ' + total.toLocaleString() + ' symbols' : '';
  document.getElementById('refreshElapsed').textContent = d.elapsed_sec ? d.elapsed_sec + 's elapsed' : '';
  document.getElementById('refreshETA').textContent = d.eta_sec > 0 ? 'ETA: ' + d.eta_sec + 's' : '';
}

function cancelRefresh() {
  fetch('/api/refresh/cancel', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({market: MARKET})
  }).then(() => {
    document.getElementById('refreshPanel').style.display = 'none';
    if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
    showToast('Refresh cancelled');
  }).catch(() => {});
}

function checkRefreshStatus() {
  fetch('/api/refresh/status?market=' + encodeURIComponent(MARKET)).then(r => r.json()).then(d => {
    if (d.status === 'running') {
      updateRefreshPanel(d);
      document.getElementById('refreshPanel').style.display = 'block';
      if (!refreshInterval) refreshInterval = setInterval(pollRefresh, 2000);
    } else {
      document.getElementById('refreshPanel').style.display = 'none';
      if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
    }
  }).catch(() => {});
}

checkRefreshStatus();

function loadSidebarStats() {
  fetch('/api/market-stats?market=' + MARKET).then(r => r.json()).then(d => {
    document.getElementById('statTotal').textContent = 'Stocks: ' + (d.total_assets || 0).toLocaleString();
    document.getElementById('statBars').textContent = 'With bars: ' + (d.with_bars || 0).toLocaleString();
    document.getElementById('statOldest').textContent = 'Oldest: ' + (d.oldest_date || 'N/A');
    document.getElementById('statLatest').textContent = 'Latest: ' + (d.latest_date || 'N/A');
    document.getElementById('statNew').textContent = 'New IPOs: ' + (d.last_refresh.new_stocks || 0) + ' last refresh';
    var lr = d.last_refresh || {};
    if (lr.status === 'running') {
      document.getElementById('statRefresh').textContent = 'Refreshing: ' + (lr.phase || '...');
    } else if (lr.finished_at) {
      document.getElementById('statRefresh').textContent = 'Updated: ' + lr.finished_at;
    } else {
      document.getElementById('statRefresh').textContent = '';
    }
  }).catch(() => {});
}
loadSidebarStats();
</script>

<script>
const SID = "S018209";
const MARKET = "US";

function fmt(n, d=2) { return (n==null||n==='') ? '-' : Number(n).toFixed(d); }
function signedPct(n) {
  n = Number(n); if (!Number.isFinite(n)) return '-';
  return (n>=0?'+':'') + n.toFixed(2) + '%';
}

function loadDetail() {
  fetch('/api/basket-screener/detail/' + SID + '?market=' + MARKET).then(r => r.json()).then(d => {
    if (d.error) { document.getElementById('loadingState').innerHTML = '<div class="empty-state"><h3>String not found</h3></div>'; return; }
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('detailBody').style.display = 'block';

    const u = d.universe || {};
    document.getElementById('exprBox').textContent = u.expression || SID;
    document.getElementById('metaBox').innerHTML =
      `Constituents: <b>${u.num_stocks||0}</b> &nbsp;|&nbsp; Created: ${u.created_at||''}`;

    const m = d.metrics || {};
    const cards = [
      ['AI Matrix', fmt(m.ai_matrix), 'heat'],
      ['AI Conclusion', m.ai_conclusion || '-', 'badge'],
      ['Value (index)', fmt(m.price), 'num'],
      ['Chg%', signedPct(m.change_pct), Number(m.change_pct)>=0?'up':'down'],
      ['Next Day %', signedPct(m.next_day_return), Number(m.next_day_return)>=0?'up':'down'],
      ['Wtd Alpha', fmt(m.weighted_alpha), Number(m.weighted_alpha)>=0?'up':'down'],
      ['ST Signal', m.atr_signal==1?'Above':m.atr_signal==-1?'Below':'Neutral', 'badge'],
      ['Accel', m.accel_signal==1?'UP':m.accel_signal==-1?'DOWN':'Neutral', 'badge'],
      ['ATR%', fmt(m.atrp), 'num'],
      ['Streak', fmt(m.streak,0), Number(m.streak)>=0?'up':'down'],
      ['P(Up) 1D', fmt(m.prob_up_1d), 'heat'],
      ['Volume', (m.volume||0).toLocaleString(), 'num'],
    ];
    document.getElementById('metricsGrid').innerHTML = cards.map(c => {
      let v = c[1];
      if (c[2]==='heat') v = `<span class="heat-pill">${v}</span>`;
      else if (c[2]==='badge') {
        const b = c[1]==='BUY'||c[1]==='Above'||c[1]==='UP' ? 'badge-up' : (c[1]==='SELL'||c[1]==='Below'||c[1]==='DOWN')?'badge-down':'badge-info';
        v = `<span class="badge ${b}">${c[1]}</span>`;
      } else if (c[2]==='up') v = `<span class="text-up">${c[1]}</span>`;
      else if (c[2]==='down') v = `<span class="text-down">${c[1]}</span>`;
      return `<div class="card" style="padding:12px"><div class="lbl" style="font-size:11px;color:#888">${c[0]}</div><div style="font-size:18px;font-weight:600;margin-top:4px">${v}</div></div>`;
    }).join('');

    drawChart(d.history || []);
    renderConstituents(d.contributions || []);
  }).catch(() => {
    document.getElementById('loadingState').innerHTML = '<div class="empty-state"><h3>Failed to load</h3></div>';
  });
}

function drawChart(history) {
  if (!history.length) { document.getElementById('chartBox').innerHTML = '<p class="text-muted">No history.</p>'; return; }
  const W = 1000, H = 280, pad = 30;
  const prices = history.map(h => parseFloat(h.price) || 0).filter(x => x > 0);
  const aim = history.map(h => parseFloat(h.ai_matrix) || 0);
  if (!prices.length) return;
  const pmin = Math.min(...prices), pmax = Math.max(...prices);
  const n = prices.length;
  const x = i => pad + (W - 2*pad) * (n<=1?0.5:i/(n-1));
  const y = v => H - pad - (H - 2*pad) * ((v - pmin) / (pmax - pmin || 1));
  let line = prices.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  let aimPts = aim.map((v,i) => `${x(i).toFixed(1)},${(H - pad - (H-2*pad)*(v/100)).toFixed(1)}`).join(' ');
  document.getElementById('chartBox').innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%">
      <polyline points="${line}" fill="none" stroke="#27e08a" stroke-width="2"/>
      <polyline points="${aimPts}" fill="none" stroke="#4aa3ff" stroke-width="1.5" opacity="0.8"/>
      <text x="${pad}" y="16" fill="#888" font-size="11">Basket Value (green) / AI Matrix (blue, 0-100)</text>
    </svg>`;
}

function renderConstituents(cons) {
  document.getElementById('consCount').textContent = cons.length;
  if (!cons.length) { document.getElementById('consTable').innerHTML = '<p class="text-muted">No constituents.</p>'; return; }
  let html = '<table><thead><tr><th>Symbol</th><th>Weight</th><th>Price</th><th>Chg%</th><th>Wtd Alpha</th><th>ST</th><th>P(Up)1D</th><th>AI Matrix</th></tr></thead><tbody>';
  cons.forEach(c => {
    const st = c.atr_signal==1?'<span class="badge badge-up">Above</span>':c.atr_signal==-1?'<span class="badge badge-down">Below</span>':'-';
    const cls = Number(c.change_pct)>=0?'text-up':'text-down';
    html += `<tr><td><a href="/${MARKET==='INDIA'?'india/':''}stock/${c.symbol}">${c.symbol}</a></td>` +
      `<td>${c.weight}</td><td>${fmt(c.price)}</td>` +
      `<td class="${cls}">${signedPct(c.change_pct)}</td><td>${fmt(c.weighted_alpha)}</td>` +
      `<td>${st}</td><td>${fmt(c.prob_up_1d)}</td><td><span class="heat-pill">${fmt(c.ai_matrix)}</span></td></tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('consTable').innerHTML = html;
}

loadDetail();
</script>
